    <script>
    const ICONS = {
        timer: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="8" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M12 14V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M12 6V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M9 2h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M18.5 7l1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>`,
        gear: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" fill="none" stroke="currentColor" stroke-width="1.5"></path><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg>`,
        speaker: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>`,
        haptic: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M11 18h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M3 8c-1 1.5-1 5.5 0 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M21 8c1 1.5 1 5.5 0 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>`,
        trophy: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18 9h3a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M6 5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4a6 6 0 0 1-12 0V5z" fill="none" stroke="currentColor" stroke-width="1.5"></path><path d="M12 15v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M8 21h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M10 18h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>`,
        play: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8V4z" fill="currentColor" stroke="none"></path></svg>`
    };

    const COLORS = ['--p1', '--p2', '--p3', '--p4', '--p5'];
    const HEX = ['#00d4ff', '#a78bfa', '#00ff87', '#ffbe00', '#ff3366'];
    const KEYS = ['a', 's', 'd', 'f', 'g'];
    const STORAGE_KEY = 'hiddenClockPrefsV2';

    const STATE = { MENU: 0, CD: 1, RUNNING: 2, GUESSING: 3, RESULT: 4, TRANSITION: 5 };
    const MODES = {
        1: {
            n: 'Predict (Manual)', short: 'Manual',
            desc: 'A hidden timer runs for a secret duration. Type your guessed time into the input field and press Lock. Your guess is hidden from other players!',
            config: `
                <div class="config-item"><label>Min (s)</label><input type="number" id="m1-min" value="3" min="1" max="30" step="0.5"></div>
                <div class="config-item"><label>Max (s)</label><input type="number" id="m1-max" value="8" min="1" max="45" step="0.5"></div>`
        },
        2: {
            n: 'Precision', short: 'Precision',
            desc: 'Tap when you think the hidden timer reaches the target. Continuous scoring rewards every millisecond of accuracy.',
            config: `<div class="config-item config-full"><label>Target (s)</label><input type="number" id="m2-tgt" value="5.0" step="0.5" min="0.5" max="30"></div>`
        },
        3: {
            n: 'Relay', short: 'Relay',
            desc: 'Players take turns hitting checkpoints in sequence. Choose Individual Laps (timer resets each turn) or Master Sabotage (continuous timer where early/late taps affect the next player).',
            config: `
                <div class="config-item config-full">
                    <label>Variant</label>
                    <select id="m3-variant" style="width:100%;padding:8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;">
                        <option value="individual">Option A — Individual Laps (timer resets)</option>
                        <option value="sabotage">Option B — Master Sabotage Timer</option>
                    </select>
                </div>
                <div class="config-item"><label>Target Duration (s)</label><input type="number" id="m3-int" value="2.0" step="0.1" min="0.5" max="10"></div>
                <div class="config-item"><label>Laps</label><input type="number" id="m3-laps" value="2" min="1" max="10" step="1"></div>
                <div class="config-item config-full">
                    <label>Escalation</label>
                    <div class="config-toggle"><span>Escalating intervals</span><label class="toggle"><input type="checkbox" id="m3-esc" checked><span class="toggle-track"></span></label></div>
                </div>`
        },
        4: {
            n: 'Bomb', short: 'Bomb',
            desc: 'Hot potato! The bomb has a hidden fuse — hold it for the minimum time, then pass before it blows. Hold longer for exponential bonus points, but pass too quickly for zero risk reward!',
            config: `
                <div class="config-item"><label>Fuse Min (s)</label><input type="number" id="m4-min" value="10" min="3" max="60" step="1"></div>
                <div class="config-item"><label>Fuse Max (s)</label><input type="number" id="m4-max" value="25" min="4" max="90" step="1"></div>
                <div class="config-item"><label>Min Hold (s)</label><input type="number" id="m4-hold" value="2.0" min="0.5" max="5.0" step="0.1"></div>
                <div class="config-item config-full">
                    <label>Risk Bonus</label>
                    <div class="config-toggle"><span>Bonus for holding longer</span><label class="toggle"><input type="checkbox" id="m4-risk" checked><span class="toggle-track"></span></label></div>
                </div>
                <div class="config-note">Hold the bomb for the minimum time before passing. Hold longer for risk bonus points!</div>`
        },
        5: {
            n: 'Cliff', short: 'Cliff',
            desc: 'Tap as close to the target as possible without going over. Cross the line and you bust for zero — don\'t fall off the cliff!',
            config: `
                <div class="config-item config-full"><label>Target (s)</label><input type="number" id="m5-tgt" value="10.0" step="0.5" min="1" max="30"></div>
                <div class="config-note" style="color:var(--danger)">Going late busts the attempt instantly.</div>`
        },
        6: {
            n: 'Predict (Tap)', short: 'Predict',
            desc: 'A hidden timer runs for a secret duration, then stops. A counter starts — tap when you think it matches the hidden time!',
            config: `
                <div class="config-item"><label>Min (s)</label><input type="number" id="m6-min" value="3" min="1" max="30" step="0.5"></div>
                <div class="config-item"><label>Max (s)</label><input type="number" id="m6-max" value="8" min="1" max="45" step="0.5"></div>`
        },
        7: {
            n: 'Blind Countdown', short: 'Blind',
            desc: 'A countdown starts visible, then vanishes partway through. Tap when you believe it has reached absolute zero.',
            config: `
                <div class="config-item"><label>Countdown Min (s)</label><input type="number" id="m7-min" value="5" min="1" max="60" step="1"></div>
                <div class="config-item"><label>Countdown Max (s)</label><input type="number" id="m7-max" value="15" min="2" max="90" step="1"></div>
                <div class="config-item"><label>Hide After (%)</label><input type="number" id="m7-hide" value="50" min="10" max="90" step="5"></div>
                <div class="config-note">Timer hides after the specified percentage of the countdown has elapsed.</div>`
        },
        8: {
            n: 'Duel', short: 'Duel',
            desc: 'Quick Draw standoff! Wait for the "DRAW!" signal, then tap. Tap before the signal = misfire. Fastest reaction after the signal wins!',
            config: `
                <div class="config-item"><label>Delay Min (s)</label><input type="number" id="m8-min" value="2" min="1" max="10" step="0.5"></div>
                <div class="config-item"><label>Delay Max (s)</label><input type="number" id="m8-max" value="6" min="2" max="15" step="0.5"></div>
                <div class="config-note">A random delay before "DRAW!" — tap early and you misfire!</div>`
        },
        9: {
            n: 'Reflex', short: 'Reflex',
            desc: 'A countdown runs, freezes at a random point, then flashes GREEN after a hidden delay. Tap on green — early taps are disqualified!',
            config: `
                <div class="config-item"><label>Countdown (s)</label><input type="number" id="m9-cd" value="3" min="1" max="10" step="0.5"></div>
                <div class="config-note">Countdown freezes, then flashes green. Tap ONLY on green!</div>`
        }
    };

    let players = Array.from({ length: 5 }, (_, i) => ({
        id: i + 1,
        name: `P${i + 1}`,
        color: HEX[i],
        var: COLORS[i],
        score: 0,
        active: i < 2
    }));
    let playerCount = 2;
    let totalRounds = 3;
    let currentRound = 1;
    let currentMode = 1;
    let gs = STATE.MENU;
    let startTime = 0;
    let modeData = {};
    let timeoutHandles = [];
    let intervalHandles = [];
    let rafHandle = 0;

    const el = id => document.getElementById(id);
    const display = el('display');
    const statusText = el('status-text');
    const arena = el('arena');
    const resultPanel = el('result-panel');
    const mainBtn = el('main-btn');
    const guessInput = el('guess-input');

    const activePlayers = () => players.slice(0, playerCount).map(p => ({ ...p, active: true }));
    const realActivePlayers = () => players.slice(0, playerCount);
    const safe = str => String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const fmt = ms => (ms / 1000).toFixed(3);
    const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
    const rand = (min, max) => min + Math.random() * (max - min);

    function addTimeout(fn, ms) { const id = setTimeout(fn, ms); timeoutHandles.push(id); return id; }
    function addInterval(fn, ms) { const id = setInterval(fn, ms); intervalHandles.push(id); return id; }
    function clearTimers() {
        timeoutHandles.forEach(clearTimeout);
        intervalHandles.forEach(clearInterval);
        timeoutHandles = [];
        intervalHandles = [];
        if (rafHandle) cancelAnimationFrame(rafHandle);
        rafHandle = 0;
    }
    function liveDisplay(step) {
        if (rafHandle) cancelAnimationFrame(rafHandle);
        const tick = () => {
            const keepGoing = step();
            if (keepGoing === false) {
                rafHandle = 0;
                return;
            }
            rafHandle = requestAnimationFrame(tick);
        };
        tick();
    }

    function syncPlayerFlags() {
        players.forEach((p, i) => { p.active = i < playerCount; });
    }

    function getPts(diff, maxPts = 1000, decayRate = 1.5, playerId = null) {
        // Rubber-banding: players in last place get a more forgiving decay rate
        let adjustedDecay = decayRate;
        if (playerId != null && playerCount > 1) {
            const pool = realActivePlayers();
            const maxScore = Math.max(...pool.map(p => p.score), 0);
            const myScore = (pool.find(p => p.id === playerId) || {}).score || 0;
            if (maxScore > 0) {
                const deficit = (maxScore - myScore) / maxScore; // 0 = leading, 1 = far behind
                // Up to 60% more forgiving decay for last place players
                adjustedDecay = decayRate * (1 + deficit * 0.6);
            }
        }
        const score = Math.round(maxPts * Math.exp(-diff / (adjustedDecay * 1000)));
        let label, color;
        if (score >= 900) { label = 'PERFECT'; color = 'var(--warn)'; }
        else if (score >= 600) { label = 'GREAT'; color = 'var(--success)'; }
        else if (score >= 300) { label = 'GOOD'; color = 'var(--p1)'; }
        else { label = 'MISS'; color = 'var(--danger)'; }
        return { p: score, l: label, c: color };
    }

    let _audioCtx = null;
    function getAudioCtx() {
        if (!_audioCtx || _audioCtx.state === 'closed') {
            _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (_audioCtx.state === 'suspended') _audioCtx.resume();
        return _audioCtx;
    }

    function snd(type) {
        if (!el('s-sound').checked) return;
        try {
            const ac = getAudioCtx();
            const t = ac.currentTime;
            const play = (f, d, w='sine', v=0.2, dt=0) => {
                const o = ac.createOscillator(), g = ac.createGain();
                o.connect(g); g.connect(ac.destination); o.type = w; o.frequency.value = f;
                g.gain.setValueAtTime(v, t + dt); g.gain.exponentialRampToValueAtTime(0.001, t + dt + d);
                o.start(t + dt); o.stop(t + dt + d + 0.1);
            };
            const map = {
                tick: () => play(600, 0.05, 'sine', 0.1),
                go: () => { play(660, 0.05); play(880, 0.1, 'sine', 0.2, 0.1); },
                tap: () => play(300, 0.05, 'square', 0.1),
                good: () => { play(660, 0.1); play(880, 0.2, 'sine', 0.2, 0.1); },
                perf: () => { play(880, 0.1); play(1100, 0.1, 'sine', 0.2, 0.1); play(1320, 0.3, 'sine', 0.2, 0.2); },
                bad: () => { play(250, 0.1, 'sawtooth', 0.15); play(200, 0.2, 'sawtooth', 0.15, 0.1); },
                exp: () => play(100, 0.5, 'square', 0.3)
            };
            if (map[type]) map[type]();
        } catch (e) {}
    }
    function hap(pat = [30]) { if (el('s-haptic').checked && navigator.vibrate) navigator.vibrate(pat); }
    function ripple(e, target) {
        if (!e || !target) return;
        const r = document.createElement('span');
        r.className = 'ripple';
        const rect = target.getBoundingClientRect();
        const sz = Math.max(rect.width, rect.height) * 2;
        r.style.cssText = `width:${sz}px;height:${sz}px;left:${(e.clientX || rect.left + rect.width / 2) - rect.left - sz / 2}px;top:${(e.clientY || rect.top + rect.height / 2) - rect.top - sz / 2}px;`;
        target.appendChild(r);
        setTimeout(() => r.remove(), 500);
    }
    function shakeUI() { el('game-container').classList.add('shake'); setTimeout(() => el('game-container').classList.remove('shake'), 400); }
    function spawnConfetti() {
        const c = el('particles');
        for (let i = 0; i < 40; i++) {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'particle';
                const s = 5 + Math.random() * 8;
                p.style.cssText = `left:${Math.random() * 100}vw; top:-10px; width:${s}px; height:${s}px; background:${HEX[Math.floor(Math.random() * HEX.length)]}; animation-duration:${1 + Math.random()}s;`;
                c.appendChild(p);
                setTimeout(() => p.remove(), 2000);
            }, i * 20);
        }
    }

    function savePrefs() {
        const payload = {
            playerCount,
            names: players.map(p => p.name),
            sound: el('s-sound')?.checked ?? true,
            haptic: el('s-haptic')?.checked ?? true,
            lastMode: currentMode
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }
    function loadPrefs() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const prefs = JSON.parse(raw);
            if (prefs.playerCount) playerCount = clamp(parseInt(prefs.playerCount, 10) || 2, 1, 5);
            if (Array.isArray(prefs.names)) prefs.names.slice(0, 5).forEach((name, i) => { if (name) players[i].name = String(name).slice(0, 8); });
            syncPlayerFlags();
            if (typeof prefs.sound === 'boolean') el('s-sound').checked = prefs.sound;
            if (typeof prefs.haptic === 'boolean') el('s-haptic').checked = prefs.haptic;
            if (prefs.lastMode && MODES[prefs.lastMode]) currentMode = Number(prefs.lastMode);
        } catch (e) {}
    }

    function buildStaticUi() {
        el('game-title').innerHTML = `${ICONS.timer} HIDDEN CLOCK`;
        el('settings-btn').innerHTML = ICONS.gear;
        el('sound-label').innerHTML = `${ICONS.speaker}<span>Sound Effects</span>`;
        el('haptic-label').innerHTML = `${ICONS.haptic}<span>Haptic Feedback</span>`;
        mainBtn.innerHTML = `${ICONS.play} START`;

        const modeList = el('mode-list');
        modeList.innerHTML = Object.entries(MODES).map(([id, mode]) => (
            `<div class="mode-card${Number(id) === currentMode ? ' active' : ''}" role="button" tabindex="0" data-mode-id="${id}" onclick="selectModeFromModal(${id})" onkeydown="if(event.key==='Enter'||event.key===' '){selectModeFromModal(${id})}">
                <div class="mode-card-id">M${id}</div>
                <div class="mode-card-body">
                    <div class="mode-card-name">${safe(mode.n)}</div>
                    <div class="mode-card-desc">${safe(mode.desc)}</div>
                </div>
            </div>`
        )).join('');

        updateModeBtnLabel();

        const helpList = el('help-list');
        helpList.innerHTML = Object.entries(MODES).map(([id, mode]) => `
            <div class="help-card">
                <h4>M${id} — ${safe(mode.n)}</h4>
                <p>${safe(mode.desc)}</p>
            </div>`).join('');
    }

    function buildSettings() {
        el('s-pcount').value = String(playerCount);
        const pInputs = el('player-inputs');
        pInputs.innerHTML = '';
        players.slice(0, playerCount).forEach((p, i) => {
            const row = document.createElement('div');
            row.className = 'player-row';
            row.innerHTML = `<div class="p-color-dot" style="background:${p.color}"></div><input type="text" maxlength="8">`;
            const input = row.querySelector('input');
            input.value = p.name;
            input.addEventListener('input', ev => {
                players[i].name = (ev.target.value || `P${i + 1}`).slice(0, 8);
                renderScoreboard();
                updateKbHint();
                savePrefs();
            });
            input.addEventListener('blur', ev => {
                if (!ev.target.value.trim()) {
                    ev.target.value = `P${i + 1}`;
                    players[i].name = ev.target.value;
                    renderScoreboard();
                    savePrefs();
                }
            });
            pInputs.appendChild(row);
        });
    }

    function renderScoreboard() {
        const board = el('scoreboard');
        const currentPlayers = realActivePlayers();
        const maxScore = Math.max(...currentPlayers.map(p => p.score), 0);
        board.innerHTML = currentPlayers.map(p => `
            <div class="score-card${p.score === maxScore && maxScore > 0 ? ' lead' : ''}" style="border-bottom: 3px solid var(${p.var})">
                <div class="score-name" style="color:var(${p.var})">${safe(p.name)}</div>
                <div class="score-pts">${p.score}</div>
            </div>`).join('');
    }

    function renderProgress() {
        const done = Math.min(Math.max(currentRound - 1, 0), totalRounds);
        el('round-progress').innerHTML = Array.from({ length: totalRounds }, (_, i) => `<div class="round-pip${i < done ? ' done' : ''}"></div>`).join('');
    }

    function renderModeConfig() {
        const mode = MODES[currentMode];
        el('config-area').innerHTML = `
            <div class="mode-desc">
                <h3>M${currentMode} — ${safe(mode.n)}</h3>
                <p>${safe(mode.desc)}</p>
            </div>
            ${mode.config}`;
    }

    function updatePlayerCount() {
        playerCount = clamp(parseInt(el('s-pcount').value, 10) || 2, 1, 5);
        syncPlayerFlags();
        buildSettings();
        savePrefs();
        resetMatch();
    }

    function updateModeBtnLabel() {
        const mode = MODES[currentMode];
        el('mode-btn-label').textContent = `M${currentMode} ${mode.short}`;
    }

    function selectModeFromModal(m) {
        setMode(m);
        closeModes();
    }

    function setMode(m) {
        if (gs !== STATE.MENU) return;
        currentMode = Number(m);
        document.querySelectorAll('.mode-card').forEach(card => {
            card.classList.toggle('active', Number(card.dataset.modeId) === currentMode);
        });
        updateModeBtnLabel();
        renderModeConfig();
        savePrefs();
        resetMatch();
    }

    function resetMatch() {
        totalRounds = parseInt(el('s-rounds').value, 10) || 3;
        currentRound = 1;
        players.forEach(p => { p.score = 0; });
        renderScoreboard();
        renderProgress();
        resetUI();
    }

    function setMainButton(text, icon = true) {
        mainBtn.innerHTML = `${icon ? ICONS.play : ''}${text}`;
    }

    function resetUI() {
        clearTimers();
        gs = STATE.MENU;
        modeData = {};
        arena.classList.add('hidden');
        arena.innerHTML = '';
        el('guess-stage').classList.remove('show');
        el('guess-inputs-all').innerHTML = '';
        el('guess-input').style.display = 'none';
        el('guess-confirm-btn').style.display = '';
        el('mode-btn').disabled = false;
        el('mode-btn').style.opacity = '';
        el('main-action').style.display = 'block';
        resultPanel.classList.remove('show');
        resultPanel.innerHTML = '';
        display.className = 'stopwatch-display';
        display.textContent = '00.000';
        display.style.color = '';
        statusText.style.color = '';
        statusText.textContent = `Round ${currentRound} / ${totalRounds}`;
        setMainButton('START');
        el('restart-link').classList.remove('show');
        el('game-container').classList.remove('pulse-glow');
        el('game-container').style.background = '';
        el('heartbeat-indicator').style.display = 'none';
        el('heartbeat-indicator').classList.remove('heartbeat-pulse');
        const echoTrack = el('echo-bar-track');
        if (echoTrack) echoTrack.remove();
        const replayBtn = el('echo-replay-btn');
        if (replayBtn) replayBtn.remove();
        renderScoreboard();
        renderProgress();
        updateKbHint();
    }

    function updateKbHint() {
        if (gs === STATE.GUESSING) {
            el('kb-hint').innerHTML = 'Type your guess and press SPACE or ENTER to confirm';
            return;
        }
        if (gs === STATE.RUNNING) {
            const rendered = [...arena.querySelectorAll('.player-btn')].map(btn => {
                const id = Number(btn.dataset.pid);
                const player = players.find(p => p.id === id);
                return `<span style="color:var(${player.var})">[${KEYS[id - 1].toUpperCase()}] ${safe(player.name)}</span>`;
            }).join(' &nbsp; ');
            el('kb-hint').innerHTML = rendered || 'SPACE to start/confirm';
            return;
        }
        el('kb-hint').innerHTML = 'SPACE to start/confirm';
    }

    function renderArena(ids = realActivePlayers().map(p => p.id), subtitleFn = p => `Tap or ${KEYS[p.id - 1].toUpperCase()}`, statFn = () => 'READY') {
        arena.innerHTML = '';
        ids.forEach(id => {
            const p = players.find(player => player.id === id);
            if (!p) return;
            arena.innerHTML += `
                <button class="player-btn" data-pid="${p.id}" id="btn-p${p.id}" style="color:var(${p.var})">
                    <span class="pb-name">${safe(p.name)}</span>
                    <span class="pb-stat" id="stat-p${p.id}">${safe(statFn(p))}</span>
                    <span class="pb-sub" id="sub-p${p.id}">${safe(subtitleFn(p))}</span>
                </button>`;
        });
        attachArenaListeners();
        arena.classList.toggle('hidden', ids.length === 0);
    }

    function attachArenaListeners() {
        arena.querySelectorAll('.player-btn').forEach(btn => {
            btn.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                const pId = Number(this.dataset.pid);
                arenaTap(pId, e);
            }, { passive: false });
        });
    }

    function showToast(text, color = '') {
        statusText.textContent = text;
        statusText.style.color = color;
    }

    function startNumericCountdown(onComplete) {
        gs = STATE.CD;
        el('mode-btn').disabled = true;
        el('mode-btn').style.opacity = '0.4';
        el('main-action').style.display = 'none';
        resultPanel.classList.remove('show');
        arena.classList.add('hidden');
        let count = 3;
        display.className = 'stopwatch-display cd-pop';
        display.textContent = '03.000';
        showToast('Get ready...');
        snd('tick'); hap([15]);
        const tick = () => {
            count -= 1;
            if (count > 0) {
                display.className = 'stopwatch-display';
                void display.offsetWidth;
                display.className = 'stopwatch-display cd-pop';
                display.textContent = `0${count}.000`;
                snd('tick'); hap([15]);
                addTimeout(tick, 1000);
            } else {
                display.className = 'stopwatch-display running';
                snd('go'); hap([10, 30, 50]);
                onComplete();
            }
        };
        addTimeout(tick, 1000);
    }

    function startCountdown() {
        startNumericCountdown(() => launchMode());
    }

    function handleMainAction(e) {
        if (e) ripple(e, mainBtn);
        if (gs === STATE.MENU) startCountdown();
        else if (gs === STATE.RESULT) {
            if (currentRound > totalRounds) resetMatch();
            else resetUI();
        }
    }

    function quickRestart(e) {
        if (e) e.preventDefault();
        resetMatch();
    }

    function arenaTap(pId, e) {
        if (gs !== STATE.RUNNING) return;
        const btn = el(`btn-p${pId}`);
        if (!btn || btn.disabled) return;
        if (e) ripple(e, btn);
        hap([20]); snd('tap');

        if (currentMode === 2) return precisionHit(pId);
        if (currentMode === 1) return manualPredictHit(pId);
        if (currentMode === 3) return relayHit(pId);
        if (currentMode === 4) return bombHit(pId);
        if (currentMode === 5) return zenithHit(pId);
        if (currentMode === 6) return predictTapHit(pId);
        if (currentMode === 7) return blindHit(pId);
        if (currentMode === 8) return duelHit(pId);
        if (currentMode === 9) return splitHit(pId);
    }

    function sanitizeRange(minId, maxId, defaults) {
        let min = parseFloat(el(minId)?.value ?? defaults.min);
        let max = parseFloat(el(maxId)?.value ?? defaults.max);
        if (Number.isNaN(min)) min = defaults.min;
        if (Number.isNaN(max)) max = defaults.max;
        if (min > max) [min, max] = [max, min];
        return [min, max];
    }

    function launchMode() {
        clearTimers();
        gs = STATE.RUNNING;
        startTime = performance.now();
        const ids = realActivePlayers().map(p => p.id);

        if (currentMode === 1) {
            display.textContent = '??.???';
            const [minS, maxS] = sanitizeRange('m1-min', 'm1-max', { min: 3, max: 8 });
            modeData.target = rand(minS * 1000, maxS * 1000);
            modeData.stopped = false;
            showToast('Clock is running... invisibly!');
            snd('go');
            const hbEl = el('heartbeat-indicator');
            hbEl.style.display = 'block';
            hbEl.classList.add('heartbeat-pulse');
            modeData.heartbeatAc = null;
            try {
                const ac = getAudioCtx();
                modeData.heartbeatAc = ac;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain); gain.connect(ac.destination);
                osc.type = 'sine'; osc.frequency.value = 1.5;
                gain.gain.value = 0.04;
                const lfo = ac.createOscillator();
                const lfoGain = ac.createGain();
                lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
                lfo.frequency.value = 0.3 + Math.random() * 0.5;
                lfoGain.gain.value = 0.8;
                lfo.start(); osc.start();
                modeData.heartbeatOsc = osc;
                modeData.heartbeatLfo = lfo;
            } catch(e) {}
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                if (elapsed >= modeData.target && !modeData.stopped) {
                    modeData.stopped = true;
                    modeData.actual = elapsed;
                    clearTimers();
                    snd('bad');
                    hbEl.style.display = 'none';
                    hbEl.classList.remove('heartbeat-pulse');
                    if (modeData.heartbeatOsc) { try { modeData.heartbeatOsc.stop(); } catch(e){} }
                    if (modeData.heartbeatLfo) { try { modeData.heartbeatLfo.stop(); } catch(e){} }
                    // Manual input: players type their guess and press Lock
                    gs = STATE.RUNNING;
                    modeData.guesses = {};
                    modeData.lockedCount = 0;
                    display.className = 'stopwatch-display';
                    display.textContent = 'TIME\'S UP';
                    showToast('Type your guess and press Lock!', 'var(--success)');
                    // Build manual input UI for each player
                    arena.classList.remove('hidden');
                    arena.innerHTML = '';
                    realActivePlayers().forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'player-zone';
                        card.style.setProperty('--zone-color', `var(${p.var})`);
                        card.innerHTML = `
                            <div class="zone-name" style="color:var(${p.var})">${safe(p.name)}</div>
                            <div class="manual-guess-container" id="guess-container-p${p.id}" style="display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0;">
                                <input type="number" id="guess-input-p${p.id}" placeholder="seconds" step="0.001" min="0" max="999"
                                    style="width:100px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Orbitron',sans-serif;font-size:0.9rem;text-align:center;">
                                <button class="btn btn-outline" id="guess-lock-p${p.id}" onclick="lockManualGuess(${p.id})"
                                    style="padding:8px 14px;font-size:0.8rem;font-weight:700;">LOCK</button>
                            </div>
                            <div class="zone-stat" id="stat-p${p.id}" style="font-size:0.8rem;color:var(--text-dim)">Enter your guess</div>`;
                        arena.appendChild(card);
                    });
                    updateKbHint();
                    return false;
                }
            });
            return;
        }

        if (currentMode === 6) {
            display.textContent = '??.???';
            const [minS, maxS] = sanitizeRange('m6-min', 'm6-max', { min: 3, max: 8 });
            modeData.target = rand(minS * 1000, maxS * 1000);
            modeData.stopped = false;
            showToast('Clock is running... invisibly!');
            snd('go');
            const hbEl6 = el('heartbeat-indicator');
            hbEl6.style.display = 'block';
            hbEl6.classList.add('heartbeat-pulse');
            modeData.heartbeatAc = null;
            try {
                const ac = getAudioCtx();
                modeData.heartbeatAc = ac;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain); gain.connect(ac.destination);
                osc.type = 'sine'; osc.frequency.value = 1.5;
                gain.gain.value = 0.04;
                const lfo = ac.createOscillator();
                const lfoGain = ac.createGain();
                lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
                lfo.frequency.value = 0.3 + Math.random() * 0.5;
                lfoGain.gain.value = 0.8;
                lfo.start(); osc.start();
                modeData.heartbeatOsc = osc;
                modeData.heartbeatLfo = lfo;
            } catch(e) {}
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                if (elapsed >= modeData.target && !modeData.stopped) {
                    modeData.stopped = true;
                    modeData.actual = elapsed;
                    clearTimers();
                    snd('bad');
                    hbEl6.style.display = 'none';
                    hbEl6.classList.remove('heartbeat-pulse');
                    if (modeData.heartbeatOsc) { try { modeData.heartbeatOsc.stop(); } catch(e){} }
                    if (modeData.heartbeatLfo) { try { modeData.heartbeatLfo.stop(); } catch(e){} }
                    // Tap-to-lock: show a running counter, players tap to lock their guess
                    gs = STATE.RUNNING;
                    modeData.guesses = {};
                    modeData.lockedCount = 0;
                    modeData.guessStart = performance.now();
                    display.className = 'stopwatch-display running';
                    showToast('TAP when the counter matches!', 'var(--success)');
                    renderArena(ids);
                    updateKbHint();
                    liveDisplay(() => {
                        if (modeData.lockedCount >= realActivePlayers().length) return false;
                        const guessElapsed = performance.now() - modeData.guessStart;
                        display.textContent = fmt(guessElapsed);
                    });
                    return false;
                }
            });
            return;
        }

        if (currentMode === 2) {
            modeData.target = (parseFloat(el('m2-tgt').value) || 5) * 1000;
            modeData.hits = {};
            modeData.done = 0;
            display.textContent = '??.???';
            display.classList.add('hidden-timer');
            el('game-container').classList.add('pulse-glow');
            showToast(`Target: ${fmt(modeData.target)}s`);
            renderArena(ids);
            updateKbHint();
            if (el('s-distract')?.checked) {
                modeData.distractInterval = addInterval(() => {
                    if (gs !== STATE.RUNNING) return;
                    if (Math.random() < 0.4) {
                        el('game-container').classList.add('distraction-flash');
                        setTimeout(() => el('game-container').classList.remove('distraction-flash'), 150);
                    }
                    if (Math.random() < 0.25) shakeUI();
                }, 1500 + Math.random() * 2000);
            }
            addTimeout(endRound, modeData.target + 4500);
            return;
        }

        if (currentMode === 3) {
            modeData.interval = (parseFloat(el('m3-int').value) || 2) * 1000;
            modeData.laps = clamp(parseInt(el('m3-laps').value, 10) || 2, 1, 10);
            modeData.escalating = !!el('m3-esc').checked;
            modeData.variant = el('m3-variant')?.value || 'individual';
            modeData.roundMax = realActivePlayers().length * modeData.laps;
            modeData.turnIndex = 0;
            modeData.scores = Object.fromEntries(ids.map(id => [id, 0]));
            modeData.turns = [];
            modeData.masterElapsed = 0;
            modeData.cumulativeTarget = 0;
            renderArena(ids, p => `Tap or ${KEYS[p.id - 1].toUpperCase()}`, () => '0 pts');
            relaySetTurn();
            updateKbHint();
            return;
        }

        if (currentMode === 4) {
            if (playerCount < 2) {
                gs = STATE.MENU;
                display.className = 'stopwatch-display danger';
                display.textContent = 'NOPE';
                showToast('Bomb mode needs at least 2 players.', 'var(--danger)');
                shakeUI(); snd('bad');
                addTimeout(resetUI, 900);
                return;
            }
            const [minS, maxS] = sanitizeRange('m4-min', 'm4-max', { min: 10, max: 25 });
            modeData.fuse = rand(minS * 1000, maxS * 1000);
            modeData.alive = ids.slice();
            modeData.holderIdx = Math.floor(Math.random() * modeData.alive.length);
            modeData.passCounts = Object.fromEntries(ids.map(id => [id, 0]));
            modeData.locked = null;
            modeData.minHold = (parseFloat(el('m4-hold')?.value) || 2.0) * 1000;
            modeData.riskBonus = el('m4-risk')?.checked !== false;
            modeData.holdStart = performance.now();
            modeData.riskTime = Object.fromEntries(ids.map(id => [id, 0]));
            modeData.holdUnlocked = false;
            // Randomize min hold slightly each turn (+/- 30%)
            modeData.baseMinHold = modeData.minHold;
            display.className = 'stopwatch-display danger';
            display.textContent = 'BOMB';
            renderArena(ids, p => `Pass to ${KEYS[p.id - 1].toUpperCase()}`, () => 'PASS');
            showToast(`Hold the bomb for ${(modeData.minHold / 1000).toFixed(1)}s before you can pass!`, 'var(--danger)');
            bombSetTurn(true);
            updateKbHint();
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                const pct = elapsed / modeData.fuse;
                const now = performance.now();
                const holdElapsed = now - modeData.holdStart;
                const holdRemaining = Math.max(0, modeData.minHold - holdElapsed);

                if (now < (modeData.passFlashUntil || 0)) {
                    display.textContent = '🔥 PASS!';
                } else if (holdRemaining > 0) {
                    display.textContent = `HOLD ${(holdRemaining / 1000).toFixed(1)}s`;
                } else {
                    display.textContent = '💣 PASS!';
                }

                if (holdRemaining <= 0 && !modeData.holdUnlocked) {
                    modeData.holdUnlocked = true;
                    bombUnlockPass();
                }

                const gc = el('game-container');
                if (pct > 0.3) {
                    const intensity = Math.min(1, (pct - 0.3) / 0.7);
                    gc.style.background = `rgba(${Math.round(255 * intensity)}, ${Math.round(17 * (1 - intensity))}, ${Math.round(23 * (1 - intensity))}, ${0.1 + intensity * 0.3})`;
                    if (intensity > 0.5 && Math.random() < intensity * 0.1) {
                        hap([Math.round(20 + intensity * 80)]);
                    }
                }
                if (elapsed >= modeData.fuse) {
                    gc.style.background = '';
                    bombExplode();
                    return false;
                }
            });
            return;
        }

        if (currentMode === 5) {
            modeData.target = (parseFloat(el('m5-tgt').value) || 10) * 1000;
            modeData.hits = {};
            modeData.done = 0;
            display.textContent = '??.???';
            display.classList.add('hidden-timer');
            showToast(`Target: ${fmt(modeData.target)}s — do not go over`);
            renderArena(ids);
            updateKbHint();
            addTimeout(endRound, modeData.target + 4500);
            return;
        }

        if (currentMode === 7) {
            const [minS, maxS] = sanitizeRange('m7-min', 'm7-max', { min: 5, max: 15 });
            modeData.target = rand(minS * 1000, maxS * 1000);
            const hideInput = parseInt(el('m7-hide')?.value ?? 50, 10);
            let hidePercent = clamp(Number.isNaN(hideInput) ? 50 : hideInput, 10, 90) / 100;
            if (totalRounds > 1) {
                const easyPct = 0.65;
                const hardPct = 0.15;
                const progress = (currentRound - 1) / (totalRounds - 1);
                hidePercent = easyPct - progress * (easyPct - hardPct);
            }
            modeData.hideAt = modeData.target * hidePercent;
            modeData.hidden = false;
            modeData.hits = {};
            modeData.done = 0;
            renderArena(ids);
            updateKbHint();
            showToast(`Countdown: ${fmt(modeData.target)}s • Hides at ${Math.round(hidePercent * 100)}%`);
            display.className = 'stopwatch-display running';
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, modeData.target - elapsed);
                if (elapsed >= modeData.hideAt) {
                    if (!modeData.hidden) {
                        modeData.hidden = true;
                        snd('tick');
                        showToast('HIDDEN NOW', 'var(--danger)');
                    }
                    display.textContent = '--.---';
                    display.classList.add('hidden-timer');
                } else {
                    display.classList.remove('hidden-timer');
                    display.textContent = fmt(remaining);
                }
            });
            addTimeout(endRound, modeData.target + 4000);
            return;
        }

        if (currentMode === 8) {
            const [minS, maxS] = sanitizeRange('m8-min', 'm8-max', { min: 2, max: 6 });
            modeData.delay = rand(minS * 1000, maxS * 1000);
            modeData.hits = {};
            modeData.done = 0;
            modeData.signalFired = false;
            modeData.misfires = {};
            display.textContent = 'WAIT...';
            display.className = 'stopwatch-display';
            showToast('Standoff! Wait for "DRAW!" — don\'t tap early!');
            renderArena(ids, p => `${KEYS[p.id - 1].toUpperCase()} — WAIT`, () => '...');
            updateKbHint();
            addTimeout(() => {
                if (gs !== STATE.RUNNING) return;
                modeData.signalFired = true;
                modeData.signalTime = performance.now();
                display.className = 'stopwatch-display running';
                display.textContent = 'DRAW!';
                showToast('DRAW! TAP NOW!', 'var(--success)');
                snd('go'); hap([50, 30, 80]);
                addTimeout(endRound, 3000);
            }, modeData.delay);
            return;
        }

        if (currentMode === 9) {
            const cdTime = (parseFloat(el('m9-cd')?.value) || 3) * 1000;
            modeData.cdTime = cdTime;
            modeData.hits = {};
            modeData.done = 0;
            modeData.signalFired = false;
            modeData.misfires = {};
            modeData.freezePoint = rand(0.3, 0.7);
            modeData.hiddenDelay = rand(100, 500);
            const freezeAt = cdTime * (1 - modeData.freezePoint);
            modeData.freezeAtMs = freezeAt;
            modeData.frozen = false;
            display.className = 'stopwatch-display running';
            showToast('Watch the countdown... wait for GREEN!');
            renderArena(ids);
            updateKbHint();
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, cdTime - elapsed);
                if (!modeData.frozen && elapsed >= freezeAt) {
                    modeData.frozen = true;
                    modeData.frozenValue = remaining;
                    display.textContent = fmt(remaining);
                    showToast('FROZEN... wait for it...');
                    addTimeout(() => {
                        if (gs !== STATE.RUNNING) return;
                        modeData.signalFired = true;
                        modeData.signalTime = performance.now();
                        display.className = 'stopwatch-display';
                        display.style.color = 'var(--success)';
                        display.textContent = 'GO!';
                        showToast('GREEN! TAP NOW!', 'var(--success)');
                        snd('go'); hap([50, 30, 80]);
                        addTimeout(endRound, 3000);
                    }, modeData.hiddenDelay);
                    return false;
                }
                if (!modeData.frozen) {
                    display.textContent = fmt(remaining);
                }
            });
            return;
        }
    }

    function showSimultaneousGuessUI() {
        const actives = realActivePlayers();
        el('guess-stage').classList.add('show');
        el('guess-prompt').textContent = 'Everyone: lock in your guess!';
        el('guess-prompt').style.color = '';
        el('guess-input').style.display = 'none';
        const container = el('guess-inputs-all');
        container.innerHTML = actives.map(p => `
            <div style="margin:8px 0;display:flex;align-items:center;gap:8px;" id="guess-row-${p.id}">
                <span style="color:var(${p.var});font-weight:700;font-size:0.8rem;min-width:50px;">${safe(p.name)}</span>
                <input type="number" class="guess-input" id="guess-p${p.id}" placeholder="0.000" step="0.001" min="0" style="flex:1;display:inline-block;margin:0;">
                <button class="btn btn-primary" onclick="lockGuess(${p.id}, event)" style="padding:8px 14px;font-size:0.75rem;" id="lock-p${p.id}">Lock</button>
            </div>`).join('');
        el('guess-confirm-btn').style.display = 'none';
        showToast('Timer stopped! Lock in guesses — no peeking!');
    }

    function lockGuess(pId, e) {
        if (gs !== STATE.GUESSING) return;
        const input = el(`guess-p${pId}`);
        const val = parseFloat(input.value);
        if (Number.isNaN(val) || val <= 0) { input.focus(); return; }
        modeData.guesses[pId] = val * 1000;
        modeData.lockedCount += 1;
        input.disabled = true;
        input.type = 'password';
        const lockBtn = el(`lock-p${pId}`);
        lockBtn.disabled = true;
        lockBtn.textContent = '✓';
        hap([20]); snd('tap');
        if (modeData.lockedCount >= realActivePlayers().length) {
            addTimeout(endRound, 300);
        }
    }

    function guessNext() {
        const actives = realActivePlayers();
        if (modeData.pIndex >= actives.length) { endRound(); return; }
        const p = actives[modeData.pIndex];
        el('guess-stage').classList.add('show');
        el('guess-prompt').textContent = `${p.name}, enter your guess`;
        el('guess-prompt').style.color = `var(${p.var})`;
        el('guess-input').style.display = 'block';
        el('guess-inputs-all').innerHTML = '';
        el('guess-confirm-btn').style.display = '';
        guessInput.value = '';
        addTimeout(() => guessInput.focus(), 50);
        showToast(`Actual timer complete. ${p.name} is guessing.`);
    }

    function submitGuess(e) {
        if (gs !== STATE.GUESSING) return;
        if (e) ripple(e, e.target);
        const val = parseFloat(guessInput.value);
        if (Number.isNaN(val) || val <= 0) return;
        const p = realActivePlayers()[modeData.pIndex];
        modeData.guesses[p.id] = val * 1000;
        hap([20]); snd('tap');
        modeData.pIndex += 1;
        el('guess-stage').classList.remove('show');
        addTimeout(guessNext, 180);
    }

    function precisionHit(pId) {
        if (modeData.hits?.[pId] != null) return;
        const elapsed = performance.now() - startTime;
        modeData.hits[pId] = elapsed;
        const btn = el(`btn-p${pId}`);
        btn.disabled = true; btn.classList.add('done');
        el(`stat-p${pId}`).textContent = 'LOCKED';
        modeData.done += 1;
        if (modeData.done >= realActivePlayers().length) addTimeout(endRound, 300);
    }

    function predictTapHit(pId) {
        if (modeData.guesses?.[pId] != null) return;
        if (!modeData.guessStart) return;
        const guessElapsed = performance.now() - modeData.guessStart;
        modeData.guesses[pId] = guessElapsed;
        modeData.lockedCount += 1;
        const btn = el(`btn-p${pId}`);
        btn.disabled = true; btn.classList.add('done');
        el(`stat-p${pId}`).textContent = 'LOCKED';
        snd('tap'); hap([20]);
        if (modeData.lockedCount >= realActivePlayers().length) {
            addTimeout(endRound, 400);
        }
    }

    function zenithHit(pId) {
        if (modeData.hits?.[pId] != null) return;
        const elapsed = performance.now() - startTime;
        modeData.hits[pId] = elapsed;
        const btn = el(`btn-p${pId}`);
        btn.disabled = true; btn.classList.add('done');
        modeData.done += 1;
        el(`stat-p${pId}`).textContent = 'LOCKED';
        if (modeData.done >= realActivePlayers().length) {
            const hasBust = realActivePlayers().some(p => modeData.hits[p.id] > modeData.target);
            if (hasBust) {
                display.className = 'stopwatch-display danger';
                display.textContent = 'TOO LATE — BUST';
                snd('bad'); shakeUI(); hap([60, 30, 60]);
            }
            addTimeout(endRound, hasBust ? 1200 : 300);
        }
    }
    function manualPredictHit(pId) {
        // In manual mode, tapping the arena button does nothing - players use the input field
        return;
    }

    function lockManualGuess(pId) {
        if (modeData.guesses?.[pId] != null) return;
        const input = el(`guess-input-p${pId}`);
        if (!input) return;
        const val = parseFloat(input.value);
        if (Number.isNaN(val) || val < 0) {
            showToast('Enter a valid number!', 'var(--danger)');
            return;
        }
        modeData.guesses[pId] = val * 1000; // convert seconds to ms
        modeData.lockedCount += 1;
        // Hide the value (password-like masking)
        input.type = 'password';
        input.disabled = true;
        const lockBtn = el(`guess-lock-p${pId}`);
        if (lockBtn) { lockBtn.disabled = true; lockBtn.textContent = '🔒'; }
        el(`stat-p${pId}`).textContent = 'LOCKED';
        snd('tap'); hap([20]);
        if (modeData.lockedCount >= realActivePlayers().length) {
            addTimeout(endRound, 400);
        }
    }
    function blindHit(pId) { precisionHit(pId); }
    function splitHit(pId) {
        if (modeData.hits?.[pId] != null || modeData.misfires?.[pId]) return;
        const btn = el(`btn-p${pId}`);
        if (!modeData.signalFired) {
            modeData.misfires[pId] = true;
            btn.disabled = true;
            btn.classList.add('eliminated');
            el(`stat-p${pId}`).textContent = 'EARLY';
            el(`sub-p${pId}`).textContent = 'DISQUALIFIED';
            snd('bad'); shakeUI(); hap([60]);
            modeData.done += 1;
            if (modeData.done >= realActivePlayers().length) addTimeout(endRound, 300);
            return;
        }
        const reaction = performance.now() - modeData.signalTime;
        modeData.hits[pId] = reaction;
        btn.disabled = true; btn.classList.add('done');
        el(`stat-p${pId}`).textContent = `${reaction.toFixed(0)}ms`;
        modeData.done += 1;
        if (modeData.done >= realActivePlayers().length) addTimeout(endRound, 300);
    }

    function relayTargetForTurn(turnIndex) {
        if (modeData.variant === 'sabotage') {
            return modeData.interval;
        }
        return modeData.escalating ? modeData.interval * (turnIndex + 1) : modeData.interval;
    }

    function relaySetTurn() {
        const actives = realActivePlayers();
        if (modeData.turnIndex >= modeData.roundMax) { addTimeout(endRound, 250); return; }
        const current = actives[modeData.turnIndex % actives.length];
        const lap = Math.floor(modeData.turnIndex / actives.length) + 1;
        const target = relayTargetForTurn(modeData.turnIndex);
        modeData.currId = current.id;
        modeData.currTarget = target;

        if (modeData.variant === 'sabotage') {
            modeData.cumulativeTarget += target;
            if (modeData.turnIndex === 0) {
                modeData.sabotageStart = performance.now();
            }
            startTime = modeData.sabotageStart;
        } else {
            startTime = performance.now();
        }

        display.className = 'stopwatch-display hidden-timer';
        display.textContent = '??.???';

        if (modeData.variant === 'sabotage') {
            const cTarget = modeData.cumulativeTarget;
            showToast(`Lap ${lap}/${modeData.laps} • ${current.name} • Target ${fmt(cTarget)}s (cumulative)`, `var(${current.var})`);
        } else {
            showToast(`Lap ${lap}/${modeData.laps} • ${current.name} • Target ${fmt(target)}s`, `var(${current.var})`);
        }

        actives.forEach(p => {
            const btn = el(`btn-p${p.id}`);
            btn.disabled = p.id !== current.id;
            btn.classList.remove('active', 'pulse-active');
            if (p.id === current.id) {
                btn.classList.add('active', 'pulse-active');
            }
            if (p.id !== current.id) {
                el(`stat-p${p.id}`).textContent = `${modeData.scores[p.id] || 0} pts`;
            }
        });
        try {
            const ac = getAudioCtx();
            const o = ac.createOscillator();
            const g = ac.createGain();
            const pan = ac.createStereoPanner();
            const idx = actives.findIndex(p => p.id === current.id);
            pan.pan.value = actives.length > 1 ? (idx / (actives.length - 1)) * 2 - 1 : 0;
            o.connect(g); g.connect(pan); pan.connect(ac.destination);
            o.type = 'triangle'; o.frequency.value = 880;
            g.gain.setValueAtTime(0.15, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.2);
            o.start(); o.stop(ac.currentTime + 0.25);
        } catch(e) {}
        hap([40, 20, 40]);
    }

    function relayHit(pId) {
        if (pId !== modeData.currId) return;
        const elapsed = performance.now() - startTime;

        let diff, tapTiming;
        if (modeData.variant === 'sabotage') {
            const cTarget = modeData.cumulativeTarget;
            diff = Math.abs(cTarget - elapsed);
            tapTiming = elapsed < cTarget ? 'EARLY' : (elapsed > cTarget ? 'LATE' : 'PERFECT');
            modeData.lastTapElapsed = elapsed;
        } else {
            diff = Math.abs(modeData.currTarget - elapsed);
            tapTiming = elapsed < modeData.currTarget ? 'EARLY' : (elapsed > modeData.currTarget ? 'LATE' : 'PERFECT');
        }

        const res = getPts(diff, 1000, 0.6, pId);
        modeData.scores[pId] += res.p;
        modeData.turns.push({ pId, elapsed, diff, res, target: modeData.variant === 'sabotage' ? modeData.cumulativeTarget : modeData.currTarget, tapTiming });

        const stat = el(`stat-p${pId}`);
        const sub = el(`sub-p${pId}`);
        stat.textContent = `${modeData.scores[pId]} pts`;

        if (modeData.variant === 'sabotage' && sub) {
            const indicator = tapTiming === 'EARLY' ? '⚡ EARLY' : (tapTiming === 'LATE' ? '🐢 LATE' : '✓ ON TIME');
            sub.textContent = indicator;
            sub.style.color = tapTiming === 'EARLY' ? 'var(--warn)' : (tapTiming === 'LATE' ? 'var(--danger)' : 'var(--success)');
        }

        el(`btn-p${pId}`).classList.remove('active');
        if (res.p >= 900) snd('perf');
        else if (res.p > 0) snd('good');
        else { snd('bad'); shakeUI(); }
        modeData.turnIndex += 1;
        if (modeData.turnIndex >= modeData.roundMax) addTimeout(endRound, 350);
        else addTimeout(relaySetTurn, 180);
    }

    function bombSetTurn(initial = false) {
        const holderId = modeData.alive[modeData.holderIdx];
        modeData.holdStart = performance.now();
        modeData.holdUnlocked = false;
        // Randomize min hold each turn (+/- 30% of base)
        const variance = modeData.baseMinHold * 0.3;
        modeData.minHold = modeData.baseMinHold + (Math.random() * 2 - 1) * variance;
        modeData.alive.forEach(id => {
            const btn = el(`btn-p${id}`);
            if (!btn) return;
            btn.classList.remove('active', 'cooldown', 'pulse-active');
            btn.style.borderColor = '';
            if (id === holderId) {
                btn.disabled = true;
                btn.style.borderColor = 'var(--danger)';
                btn.classList.add('active');
                btn.classList.add('cooldown');
                el(`stat-p${id}`).textContent = '💣 BOMB';
                el(`sub-p${id}`).textContent = `Hold ${(modeData.minHold / 1000).toFixed(1)}s…`;
            } else {
                btn.disabled = true;
                el(`stat-p${id}`).textContent = modeData.passCounts[id] ? `${modeData.passCounts[id]} pass${modeData.passCounts[id] === 1 ? '' : 'es'}` : 'READY';
                el(`sub-p${id}`).textContent = 'Waiting…';
            }
        });
        modeData.locked = holderId;
    }

    function bombUnlockPass() {
        if (gs !== STATE.RUNNING || currentMode !== 4) return;
        const holderId = modeData.alive[modeData.holderIdx];
        modeData.locked = null;
        modeData.alive.forEach(id => {
            const btn = el(`btn-p${id}`);
            if (!btn) return;
            if (id === holderId) {
                btn.disabled = true;
                btn.classList.remove('cooldown');
                el(`stat-p${id}`).textContent = '💣 BOMB';
                el(`sub-p${id}`).textContent = 'PASS NOW!';
            } else {
                btn.disabled = false;
                btn.classList.add('pulse-active');
                el(`sub-p${id}`).textContent = `Pass here • ${KEYS[id - 1].toUpperCase()}`;
            }
        });
        hap([30, 20, 30]);
    }

    function bombHit(pId) {
        const holderId = modeData.alive[modeData.holderIdx];
        if (pId === holderId) return;
        if (!modeData.holdUnlocked) return;
        const holdDuration = performance.now() - modeData.holdStart;
        const extraHold = Math.max(0, holdDuration - modeData.minHold);
        modeData.riskTime[holderId] = (modeData.riskTime[holderId] || 0) + extraHold;
        modeData.passCounts[holderId] += 1;
        modeData.passFlashUntil = performance.now() + 180;
        display.textContent = '🔥 PASS!';
        const targetIdx = modeData.alive.indexOf(pId);
        if (targetIdx === -1) return;
        modeData.holderIdx = targetIdx;
        snd('tick');
        bombSetTurn();
    }

    function bombExplode() {
        if (gs !== STATE.RUNNING) return;
        clearTimers();
        gs = STATE.RESULT;
        snd('exp'); shakeUI(); hap([100, 50, 100, 50, 200]);
        display.className = 'stopwatch-display danger';
        display.textContent = 'BOOM';
        const loserId = modeData.alive[modeData.holderIdx];
        const loser = players.find(p => p.id === loserId);
        const btn = el(`btn-p${loserId}`);
        if (btn) btn.classList.add('eliminated');

        let html = `<div style="color:var(--danger);font-size:1.2rem;font-weight:900;margin-bottom:10px;">${safe(loser.name)} exploded!</div><div class="result-grid">`;
        realActivePlayers().forEach(p => {
            const survived = p.id !== loserId;
            const passes = modeData.passCounts[p.id] || 0;
            const riskMs = modeData.riskTime[p.id] || 0;
            // Exponential risk bonus: points multiply the longer you hold
            // Penalize hot-potato: if total extra hold < 500ms, no risk bonus
            let riskPts = 0;
            if (modeData.riskBonus && survived && riskMs > 500) {
                // Exponential: base 1.5^(seconds held beyond minimum)
                const riskSeconds = riskMs / 1000;
                riskPts = Math.round(50 * Math.pow(1.8, riskSeconds));
            }
            const pts = survived ? 200 + passes * 50 + riskPts : 0;
            p.score += pts;
            const riskLabel = modeData.riskBonus && survived ? `<div style="font-size:0.7rem;opacity:0.8">Risk: ${(riskMs / 1000).toFixed(1)}s (+${riskPts}${riskMs <= 500 ? ' — too safe!' : ''})</div>` : '';
            html += `
                <div class="res-card">
                    <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                    <div class="res-val">${passes} pass${passes === 1 ? '' : 'es'}</div>
                    ${riskLabel}
                    <div class="res-pts ${pts === 0 ? 'zero' : ''}">${pts > 0 ? '+' : ''}${pts}</div>
                </div>`;
        });
        html += `</div>`;
        showEndScreen(html);
    }

    function duelHit(pId) {
        if (modeData.hits?.[pId] != null || modeData.misfires?.[pId]) return;
        const btn = el(`btn-p${pId}`);
        if (!modeData.signalFired) {
            modeData.misfires[pId] = true;
            btn.disabled = true;
            btn.classList.add('eliminated');
            el(`stat-p${pId}`).textContent = 'MISFIRE';
            el(`sub-p${pId}`).textContent = 'Too early!';
            snd('bad'); shakeUI(); hap([60]);
            modeData.done += 1;
            if (modeData.done >= realActivePlayers().length) addTimeout(endRound, 300);
            return;
        }
        const reaction = performance.now() - modeData.signalTime;
        modeData.hits[pId] = reaction;
        btn.disabled = true; btn.classList.add('done');
        el(`stat-p${pId}`).textContent = `${reaction.toFixed(0)}ms`;
        modeData.done += 1;
        if (modeData.done >= realActivePlayers().length) addTimeout(endRound, 300);
    }

    function setModalState(id, open) {
        el(id).classList.toggle('open', open);
        el(id).setAttribute('aria-hidden', open ? 'false' : 'true');
    }
    function openSettings() { setModalState('settings-modal', true); }
    function closeSettings() { setModalState('settings-modal', false); savePrefs(); }
    function openHelp() { setModalState('help-modal', true); }
    function closeHelp() { setModalState('help-modal', false); }
    function openModes() { setModalState('modes-modal', true); }
    function closeModes() { setModalState('modes-modal', false); }
    function bgClick(event, id) { if (event.target === el(id)) setModalState(id, false); }

    function showEndScreen(html) {
        clearTimers();
        gs = STATE.RESULT;
        display.classList.remove('hidden-timer');
        arena.classList.add('hidden');
        arena.innerHTML = '';
        snd('good');
        currentRound += 1;
        renderScoreboard();
        renderProgress();
        el('main-action').style.display = 'block';
        el('restart-link').classList.add('show');
        if (currentRound > totalRounds) {
            const pool = realActivePlayers();
            const maxScore = Math.max(...pool.map(p => p.score));
            const winners = pool.filter(p => p.score === maxScore).map(p => p.name).join(' & ');
            showToast('MATCH OVER!', 'var(--warn)');
            html = `<div class="winner-banner">${ICONS.trophy}<span>${safe(winners)} wins!</span></div>${html}`;
            setMainButton('NEW MATCH');
            spawnConfetti(); hap([50, 50, 50, 100, 200]); snd('perf');
        } else {
            showToast('Round Complete!');
            setMainButton('NEXT ROUND');
        }
        resultPanel.innerHTML = html;
        resultPanel.classList.add('show');
        updateKbHint();
    }

    function endRound() {
        clearTimers();
        gs = STATE.RESULT;
        arena.classList.add('hidden');
        let html = '';

        if (currentMode === 1 || currentMode === 6) {
            display.className = 'stopwatch-display';
            display.textContent = fmt(modeData.actual);
            html = `<div style="margin-bottom:10px;color:var(--text-dim)">Actual: <strong>${fmt(modeData.actual)}s</strong></div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const guess = modeData.guesses[p.id];
                const diff = guess == null ? Infinity : Math.abs(modeData.actual - guess);
                const res = guess == null ? { p: 0, l: 'MISS', c: 'var(--danger)' } : getPts(diff, 1000, 1.5, p.id);
                p.score += res.p;
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${guess == null ? '--' : `${fmt(guess)}s`}</div>
                        <div class="res-note">${guess == null ? 'No guess submitted' : `Off by ${fmt(Math.abs(modeData.actual - guess))}s`}</div>
                        <div class="res-pts" style="color:${res.c}">${res.l} (+${res.p})</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }

        if (currentMode === 2 || currentMode === 5 || currentMode === 7) {
            const target = modeData.target;
            display.className = 'stopwatch-display';
            display.textContent = fmt(target);
            display.style.color = '';
            el('game-container').classList.remove('pulse-glow');
            const titleMap = {
                2: 'Target',
                5: 'Target',
                7: 'Zero point'
            };

            if (currentMode === 2) {
                const sorted = realActivePlayers()
                    .map(p => ({ p, hit: modeData.hits[p.id], diff: modeData.hits[p.id] == null ? Infinity : Math.abs(target - modeData.hits[p.id]) }))
                    .sort((a, b) => a.diff - b.diff);
                const rankHtml = sorted.map((s, i) => `<div style="color:var(${s.p.var});font-weight:700;font-size:0.9rem;">#${i+1} ${safe(s.p.name)} — ${s.hit == null ? 'MISS' : fmt(s.hit) + 's'}</div>`).join('');
                const flashDiv = document.createElement('div');
                flashDiv.className = 'rankings-flash';
                flashDiv.innerHTML = `<div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:6px;">TAP ORDER</div>${rankHtml}`;
                el('game-container').appendChild(flashDiv);
                setTimeout(() => flashDiv.remove(), 2000);
            }

            html = `<div style="margin-bottom:10px;color:var(--text-dim)">${titleMap[currentMode]}: <strong>${fmt(target)}s</strong></div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const hit = modeData.hits[p.id];
                const diff = hit == null ? Infinity : Math.abs(target - hit);
                let res = hit == null ? { p: 0, l: 'MISS', c: 'var(--danger)' } : getPts(diff, 1000, 1.5, p.id);
                if (currentMode === 5 && hit != null && hit > target) res = { p: 0, l: 'BUST', c: 'var(--danger)' };
                p.score += res.p;
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${hit == null ? '--' : `${fmt(hit)}s`}</div>
                        <div class="res-note">${hit == null ? 'No tap recorded' : `Off by ${fmt(diff)}s`}</div>
                        <div class="res-pts" style="color:${res.c}">${res.l} (+${res.p})</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }

        if (currentMode === 8) {
            display.className = 'stopwatch-display';
            display.textContent = 'RESULTS';
            const validHits = realActivePlayers().filter(p => modeData.hits[p.id] != null && !modeData.misfires[p.id]);
            // Sort valid hits by speed (fastest first) for tiered scoring
            const ranked = validHits.slice().sort((a, b) => modeData.hits[a.id] - modeData.hits[b.id]);
            const tierPoints = [1000, 700, 400, 200, 100];
            const rankMap = {};
            ranked.forEach((p, i) => { rankMap[p.id] = tierPoints[i] || 0; });
            html = `<div style="margin-bottom:10px;color:var(--text-dim)">Quick Draw — Tiered Scoring</div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const misfired = !!modeData.misfires[p.id];
                const hit = modeData.hits[p.id];
                const pts = misfired || hit == null ? 0 : (rankMap[p.id] || 0);
                p.score += pts;
                const rank = ranked.findIndex(r => r.id === p.id);
                let label = misfired ? 'MISFIRE' : (hit == null ? 'NO TAP' : `${hit.toFixed(0)}ms`);
                const rankLabel = pts > 0 ? (rank === 0 ? '1st' : rank === 1 ? '2nd' : rank === 2 ? '3rd' : `${rank + 1}th`) : '';
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${label}</div>
                        <div class="res-pts ${pts === 0 ? 'zero' : ''}">${rankLabel ? rankLabel + ' ' : ''}+${pts}</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }

        if (currentMode === 9) {
            display.className = 'stopwatch-display';
            display.textContent = 'RESULTS';
            display.style.color = '';
            const validHits = realActivePlayers().filter(p => modeData.hits[p.id] != null && !modeData.misfires[p.id]);
            // Sort valid hits by speed (fastest first) for tiered scoring
            const ranked = validHits.slice().sort((a, b) => modeData.hits[a.id] - modeData.hits[b.id]);
            const tierPoints = [1000, 700, 400, 200, 100];
            const rankMap = {};
            ranked.forEach((p, i) => { rankMap[p.id] = tierPoints[i] || 0; });
            html = `<div style="margin-bottom:10px;color:var(--text-dim)">Reflex — Tiered Scoring</div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const misfired = !!modeData.misfires[p.id];
                const hit = modeData.hits[p.id];
                const pts = misfired || hit == null ? 0 : (rankMap[p.id] || 0);
                p.score += pts;
                const rank = ranked.findIndex(r => r.id === p.id);
                let label = misfired ? 'EARLY — DQ' : (hit == null ? 'NO TAP' : `${hit.toFixed(0)}ms`);
                const rankLabel = pts > 0 ? (rank === 0 ? '1st' : rank === 1 ? '2nd' : rank === 2 ? '3rd' : `${rank + 1}th`) : '';
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${label}</div>
                        <div class="res-note">${misfired ? 'DISQUALIFIED' : (rankLabel ? rankLabel + ' — ' + (rank === 0 ? 'Fastest!' : '') : '')}</div>
                        <div class="res-pts ${pts === 0 ? 'zero' : ''}">${rankLabel ? rankLabel + ' ' : ''}+${pts}</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }

        if (currentMode === 3) {
            display.className = 'stopwatch-display';
            display.textContent = 'DONE';
            const variantLabel = modeData.variant === 'sabotage' ? 'Master Sabotage' : 'Individual Laps';
            html = `<div style="margin-bottom:10px;color:var(--text-dim)">Relay complete — ${variantLabel} — ${modeData.laps} lap${modeData.laps === 1 ? '' : 's'}${modeData.escalating ? ', escalating on' : ', escalation off'}.</div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const pts = modeData.scores[p.id] || 0;
                p.score += pts;
                const playerTurns = modeData.turns.filter(t => t.pId === p.id);
                let turnDetails = '';
                if (modeData.variant === 'sabotage') {
                    turnDetails = playerTurns.map(t => {
                        const icon = t.tapTiming === 'EARLY' ? '⚡' : (t.tapTiming === 'LATE' ? '🐢' : '✓');
                        return `${icon} ${fmt(t.diff)}s off`;
                    }).join(', ');
                } else {
                    turnDetails = playerTurns.map(t => `${fmt(t.diff)}s off`).join(', ');
                }
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${pts}</div>
                        <div class="res-note">${playerTurns.length} turn${playerTurns.length === 1 ? '' : 's'}${turnDetails ? ' — ' + turnDetails : ''}</div>
                        <div class="res-pts">+${pts}</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }
    }

    document.addEventListener('keydown', event => {
        if (event.repeat) return;
        const k = event.key.toLowerCase();
        const activeTag = document.activeElement?.tagName;
        const inputLocked = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag) && document.activeElement !== guessInput;
        if (inputLocked) return;
        if (k === ' ' || event.code === 'Space') {
            event.preventDefault();
            if (gs === STATE.MENU || gs === STATE.RESULT) handleMainAction();
            else if (gs === STATE.GUESSING) submitGuess();
            return;
        }
        if (gs === STATE.GUESSING && k === 'enter') {
            event.preventDefault();
            submitGuess();
            return;
        }
        if (gs === STATE.RUNNING) {
            const idx = KEYS.indexOf(k);
            if (idx !== -1 && idx < playerCount) arenaTap(idx + 1);
        }
    });

    guessInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            submitGuess();
        }
    });

    function init() {
        syncPlayerFlags();
        loadPrefs();
        syncPlayerFlags();
        buildStaticUi();
        buildSettings();
        el('s-rounds').value = String(totalRounds);
        renderModeConfig();
        renderScoreboard();
        renderProgress();
        updateKbHint();
        setMode(currentMode);
    }

    init();
    </script>
</body>
</html>
