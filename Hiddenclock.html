    function relaySetTurn() {
        const actives = realActivePlayers();
        if (modeData.turnIndex >= modeData.roundMax) { addTimeout(endRound, 250); return; }
        const current = actives[modeData.turnIndex % actives.length];
        const lap = Math.floor(modeData.turnIndex / actives.length) + 1;
        const target = relayTargetForTurn(modeData.turnIndex);
        modeData.currId = current.id;
        modeData.currTarget = target;

        if (modeData.variant === 'sabotage') {
            modeData.cumulativeTarget += target;
            if (modeData.turnIndex === 0) {
                modeData.sabotageStart = performance.now();
            }
            startTime = modeData.sabotageStart;
        } else {
            startTime = performance.now();
        }

        display.className = 'stopwatch-display hidden-timer';
        display.textContent = '??.???';

        if (modeData.variant === 'sabotage') {
            const cTarget = modeData.cumulativeTarget;
            showToast(`Lap ${lap}/${modeData.laps} • ${current.name} • Target ${fmt(cTarget)}s (cumulative)`, `var(${current.var})`);
        } else {
            showToast(`Lap ${lap}/${modeData.laps} • ${current.name} • Target ${fmt(target)}s`, `var(${current.var})`);
        }

        actives.forEach(p => {
            const btn = el(`btn-p${p.id}`);
            btn.disabled = p.id !== current.id;
            btn.classList.remove('active', 'pulse-active');
            if (p.id === current.id) {
                btn.classList.add('active', 'pulse-active');
            }
            if (p.id !== current.id) {
                el(`stat-p${p.id}`).textContent = `${modeData.scores[p.id] || 0} pts`;
            }
        });
        try {
            const ac = getAudioCtx();
            const o = ac.createOscillator();
            const g = ac.createGain();
            const pan = ac.createStereoPanner();
            const idx = actives.findIndex(p => p.id === current.id);
            pan.pan.value = actives.length > 1 ? (idx / (actives.length - 1)) * 2 - 1 : 0;
            o.connect(g); g.connect(pan); pan.connect(ac.destination);
            o.type = 'triangle'; o.frequency.value = 880;
            g.gain.setValueAtTime(0.15, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.2);
            o.start(); o.stop(ac.currentTime + 0.25);
        } catch(e) {}
        hap([40, 20, 40]);
    }

    function relayHit(pId) {
        if (pId !== modeData.currId) return;
        const elapsed = performance.now() - startTime;

        let diff, tapTiming;
        if (modeData.variant === 'sabotage') {
            const cTarget = modeData.cumulativeTarget;
            diff = Math.abs(cTarget - elapsed);
            tapTiming = elapsed < cTarget ? 'EARLY' : (elapsed > cTarget ? 'LATE' : 'PERFECT');
            modeData.lastTapElapsed = elapsed;
        } else {
            diff = Math.abs(modeData.currTarget - elapsed);
            tapTiming = elapsed < modeData.currTarget ? 'EARLY' : (elapsed > modeData.currTarget ? 'LATE' : 'PERFECT');
        }

        const res = getPts(diff, 1000, 0.6, pId);
        modeData.scores[pId] += res.p;
        modeData.turns.push({ pId, elapsed, diff, res, target: modeData.variant === 'sabotage' ? modeData.cumulativeTarget : modeData.currTarget, tapTiming });

        const stat = el(`stat-p${pId}`);
        const sub = el(`sub-p${pId}`);
        stat.textContent = `${modeData.scores[pId]} pts`;

        if (sub) {
            const indicator = tapTiming === 'EARLY' ? '⚡ EARLY' : (tapTiming === 'LATE' ? '🐢 LATE' : '✓ ON TIME');
            sub.textContent = indicator;
            sub.style.color = tapTiming === 'EARLY' ? 'var(--warn)' : (tapTiming === 'LATE' ? 'var(--danger)' : 'var(--success)');
        }

        el(`btn-p${pId}`).classList.remove('active');
        if (res.p >= 900) snd('perf');
        else if (res.p > 0) snd('good');
        else { snd('bad'); shakeUI(); }
        modeData.turnIndex += 1;
        if (modeData.turnIndex >= modeData.roundMax) addTimeout(endRound, 350);
        else addTimeout(relaySetTurn, 180);
    }

    function bombSetTurn(initial = false) {
        const holderId = modeData.alive[modeData.holderIdx];
        modeData.holdStart = performance.now();
        modeData.holdUnlocked = false;
        // Randomize min hold each turn (+/- 30% of base)
        const variance = modeData.baseMinHold * 0.3;
        modeData.minHold = modeData.baseMinHold + (Math.random() * 2 - 1) * variance;
        modeData.alive.forEach(id => {
            const btn = el(`btn-p${id}`);
            if (!btn) return;
            btn.classList.remove('active', 'cooldown', 'pulse-active');
            btn.style.borderColor = '';
            if (id === holderId) {
                btn.disabled = true;
                btn.style.borderColor = 'var(--danger)';
                btn.classList.add('active');
                btn.classList.add('cooldown');
                el(`stat-p${id}`).textContent = '\u{1F4A3} BOMB';
                el(`sub-p${id}`).textContent = `Hold ${(modeData.minHold / 1000).toFixed(1)}s\u2026`;
            } else {
                btn.disabled = true;
                // Show cooldown indicator if this player can't receive due to rotation rule
                const isCooledDown = modeData.alive.length >= 3 && modeData.lastReceiver === id && modeData.lastPasser === holderId;
                el(`stat-p${id}`).textContent = isCooledDown ? '\u{1F6AB} COOLDOWN' : (modeData.passCounts[id] ? `${modeData.passCounts[id]} pass${modeData.passCounts[id] === 1 ? '' : 'es'}` : 'READY');
                el(`sub-p${id}`).textContent = isCooledDown ? 'Can\u2019t receive' : 'Waiting\u2026';
            }
        });
        modeData.locked = holderId;
    }

    function bombUnlockPass() {
        if (gs !== STATE.RUNNING || currentMode !== 4) return;
        const holderId = modeData.alive[modeData.holderIdx];
        modeData.locked = null;
        modeData.alive.forEach(id => {
            const btn = el(`btn-p${id}`);
            if (!btn) return;
            if (id === holderId) {
                btn.disabled = true;
                btn.classList.remove('cooldown');
                el(`stat-p${id}`).textContent = '\u{1F4A3} BOMB';
                el(`sub-p${id}`).textContent = 'PASS NOW!';
            } else {
                // Enforce pass rotation: in 3+ player games, block passing back to the person who just passed to you
                const isCooledDown = modeData.alive.length >= 3 && modeData.lastReceiver === id && modeData.lastPasser === holderId;
                if (isCooledDown) {
                    btn.disabled = true;
                    el(`stat-p${id}`).textContent = '\u{1F6AB} COOLDOWN';
                    el(`sub-p${id}`).textContent = 'Can\u2019t receive';
                } else {
                    btn.disabled = false;
                    btn.classList.add('pulse-active');
                    el(`sub-p${id}`).textContent = `Pass here \u2022 ${KEYS[id - 1].toUpperCase()}`;
                }
            }
        });
        hap([30, 20, 30]);
    }

    function bombHit(pId) {
        const holderId = modeData.alive[modeData.holderIdx];
        if (pId === holderId) return;
        if (!modeData.holdUnlocked) return;
        // Enforce pass rotation cooldown: can't pass back to person who just gave you the bomb
        if (modeData.alive.length >= 3 && modeData.lastReceiver === pId && modeData.lastPasser === holderId) return;

        const holdDuration = performance.now() - modeData.holdStart;
        const extraHold = Math.max(0, holdDuration - modeData.minHold);

        // Risk bonus exploit fix: cap the extra hold time that counts for bonus.
        // Players who hold until the visual warning cannot bank unlimited risk time.
        // Max creditable extra hold is 3 seconds per turn.
        const cappedExtra = Math.min(extraHold, 3000);
        modeData.riskTime[holderId] = (modeData.riskTime[holderId] || 0) + cappedExtra;

        modeData.passCounts[holderId] += 1;
        modeData.passFlashUntil = performance.now() + 180;
        display.textContent = '\u{1F525} PASS!';

        // Track pass rotation
        modeData.lastPasser = holderId;
        modeData.lastReceiver = pId;

        const targetIdx = modeData.alive.indexOf(pId);
        if (targetIdx === -1) return;
        modeData.holderIdx = targetIdx;
        snd('tick');
        bombSetTurn();
    }

    function bombExplode() {
        if (gs !== STATE.RUNNING) return;
        clearTimers();
        gs = STATE.RESULT;
        snd('exp'); shakeUI(); hap([100, 50, 100, 50, 200]);
        display.className = 'stopwatch-display danger';
        display.textContent = 'BOOM';
        const loserId = modeData.alive[modeData.holderIdx];
        const loser = players.find(p => p.id === loserId);
        const btn = el(`btn-p${loserId}`);
        if (btn) btn.classList.add('eliminated');

        // Participation-weighted scoring with fairness rework:
        // - Players who handle the bomb get rewarded proportionally
        // - "Never touched" players get minimal points
        // - Risk bonus with diminishing returns (sqrt) and hard cap
        // - Loser gets small consolation for passes made
        const survivors = realActivePlayers().filter(p => p.id !== loserId);
        const totalPasses = realActivePlayers().reduce((sum, p) => sum + (modeData.passCounts[p.id] || 0), 0);

        let html = `<div style="color:var(--danger);font-size:1.2rem;font-weight:900;margin-bottom:10px;">${safe(loser.name)} exploded!</div><div class="result-grid">`;
        realActivePlayers().forEach(p => {
            const survived = p.id !== loserId;
            const passes = modeData.passCounts[p.id] || 0;
            const riskMs = modeData.riskTime[p.id] || 0;

            let pts = 0;
            let riskPts = 0;
            if (survived) {
                // Base survival: 50 pts
                pts = 50;
                // Active participation bonus: 150 pts shared by pass ratio
                if (totalPasses > 0 && passes > 0) {
                    pts += Math.round(150 * (passes / totalPasses));
                }
                // "Never touched" penalty: players with 0 passes get reduced base
                if (passes === 0) {
                    pts = 20;
                }
                // Risk bonus: diminishing returns via sqrt scaling (capped)
                if (modeData.riskBonus && riskMs > 500) {
                    const riskSeconds = riskMs / 1000;
                    riskPts = Math.round(35 * Math.sqrt(riskSeconds));
                    riskPts = Math.min(riskPts, 120);
                }
                pts += riskPts;
            } else {
                // Loser consolation for passes made before explosion
                pts = Math.min(passes * 5, 30);
            }

            p.score += pts;
            const riskLabel = modeData.riskBonus && survived ? `<div style="font-size:0.7rem;opacity:0.8">Risk: ${(riskMs / 1000).toFixed(1)}s (+${riskPts}${riskMs <= 500 ? ' \u2014 too safe!' : ''})</div>` : '';
            html += `
                <div class="res-card">
                    <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                    <div class="res-val">${passes} pass${passes === 1 ? '' : 'es'}</div>
                    ${riskLabel}
                    <div class="res-pts ${pts === 0 ? 'zero' : ''}">${pts > 0 ? '+' : ''}${pts}</div>
                </div>`;
        });
        html += `</div>`;
        showEndScreen(html);
    }

    function duelHit(pId) {
        if (modeData.hits?.[pId] != null || modeData.misfires?.[pId]) return;
        const btn = el(`btn-p${pId}`);
        if (!modeData.signalFired) {
            modeData.misfires[pId] = true;
            btn.disabled = true;
            btn.classList.add('eliminated');
            el(`stat-p${pId}`).textContent = 'MISFIRE';
            el(`sub-p${pId}`).textContent = 'Too early!';
            snd('bad'); shakeUI(); hap([60]);
            modeData.done += 1;
            if (modeData.done >= realActivePlayers().length) addTimeout(endRound, 300);
            return;
        }
        const reaction = performance.now() - modeData.signalTime;
        modeData.hits[pId] = reaction;
        btn.disabled = true; btn.classList.add('done');
        el(`stat-p${pId}`).textContent = `${reaction.toFixed(0)}ms`;
        modeData.done += 1;
        if (modeData.done >= realActivePlayers().length) addTimeout(endRound, 300);
    }

    function setModalState(id, open) {
        el(id).classList.toggle('open', open);
        el(id).setAttribute('aria-hidden', open ? 'false' : 'true');
    }
    function openSettings() { setModalState('settings-modal', true); }
    function closeSettings() { setModalState('settings-modal', false); savePrefs(); }
    function openHelp() { setModalState('help-modal', true); }
    function closeHelp() { setModalState('help-modal', false); }
    function openModes() { setModalState('modes-modal', true); }
    function closeModes() { setModalState('modes-modal', false); }
    function openConfigModal() {
        // Move the original config-area into the modal so changes apply directly
        const body = el('config-modal-body');
        const configArea = el('config-area');
        body.appendChild(configArea);
        setModalState('config-modal', true);
    }
    function closeConfigModal() {
        // Move config-area back to its original hidden container
        const configArea = el('config-area');
        const hiddenHost = el('config-hidden-host');
        hiddenHost.appendChild(configArea);
        setModalState('config-modal', false);
    }
    function bgClick(event, id) { if (event.target === el(id)) setModalState(id, false); }

    function showEndScreen(html) {
        clearTimers();
        gs = STATE.RESULT;
        display.classList.remove('hidden-timer');
        arena.classList.add('hidden');
        arena.innerHTML = '';
        snd('good');
        currentRound += 1;
        saveMatchState();
        renderScoreboard();
        renderProgress();
        renderHud();
        el('main-action').style.display = 'block';
        el('restart-link').classList.add('show');
        if (currentRound > totalRounds) {
            const pool = realActivePlayers();
            const maxScore = Math.max(...pool.map(p => p.score));
            const winners = pool.filter(p => p.score === maxScore).map(p => p.name).join(' & ');
            showToast('MATCH OVER!', 'var(--warn)');
            html = `<div class="winner-banner">${ICONS.trophy}<span>${safe(winners)} wins!</span></div>${html}`;
            setMainButton('NEW MATCH');
            spawnConfetti(); hap([50, 50, 50, 100, 200]); snd('perf');
        } else {
            showToast('Round Complete!');
            setMainButton('NEXT ROUND');
        }
        resultPanel.innerHTML = html;
        resultPanel.classList.add('show');
        updateKbHint();
    }

    function endRound() {
        clearTimers();
        numpadHide();
        gs = STATE.RESULT;
        arena.classList.add('hidden');
        let html = '';

        if (currentMode === 1 || currentMode === 6) {
            display.className = 'stopwatch-display';
            display.textContent = fmt(modeData.actual);
            html = `<div style="margin-bottom:10px;color:var(--text-dim)">Actual: <strong>${fmt(modeData.actual)}s</strong></div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const guess = modeData.guesses[p.id];
                const diff = guess == null ? Infinity : Math.abs(modeData.actual - guess);
                const res = guess == null ? { p: 0, l: 'MISS', c: 'var(--danger)' } : getPts(diff, 1000, 1.5, p.id);
                p.score += res.p;
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${guess == null ? '--' : `${fmt(guess)}s`}</div>
                        <div class="res-note">${guess == null ? 'No guess submitted' : `Off by ${fmt(Math.abs(modeData.actual - guess))}s`}</div>
                        <div class="res-pts" style="color:${res.c}">${res.l} (+${res.p})</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }

        if (currentMode === 2 || currentMode === 5 || currentMode === 7) {
            const target = modeData.target;
            display.className = 'stopwatch-display';
            display.textContent = fmt(target);
            display.style.color = '';
            el('arena-container').classList.remove('pulse-glow');
            const titleMap = {
                2: 'Target',
                5: 'Target',
                7: 'Zero point'
            };

            if (currentMode === 2) {
                const sorted = realActivePlayers()
                    .map(p => ({ p, hit: modeData.hits[p.id], diff: modeData.hits[p.id] == null ? Infinity : Math.abs(target - modeData.hits[p.id]) }))
                    .sort((a, b) => a.diff - b.diff);
                const rankHtml = sorted.map((s, i) => `<div style="color:var(${s.p.var});font-weight:700;font-size:0.9rem;">#${i+1} ${safe(s.p.name)} — ${s.hit == null ? 'MISS' : fmt(s.hit) + 's'}</div>`).join('');
                const flashDiv = document.createElement('div');
                flashDiv.className = 'rankings-flash';
                flashDiv.innerHTML = `<div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:6px;">TAP ORDER</div>${rankHtml}`;
                el('arena-container').appendChild(flashDiv);
                setTimeout(() => flashDiv.remove(), 2000);
            }

            html = `<div style="margin-bottom:10px;color:var(--text-dim)">${titleMap[currentMode]}: <strong>${fmt(target)}s</strong></div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const hit = modeData.hits[p.id];
                const diff = hit == null ? Infinity : Math.abs(target - hit);
                let res = hit == null ? { p: 0, l: 'MISS', c: 'var(--danger)' } : getPts(diff, 1000, 1.5, p.id);
                if (currentMode === 5 && hit != null && hit > target) res = { p: 0, l: 'BUST', c: 'var(--danger)' };
                p.score += res.p;
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${hit == null ? '--' : `${fmt(hit)}s`}</div>
                        <div class="res-note">${hit == null ? 'No tap recorded' : `Off by ${fmt(diff)}s`}</div>
                        <div class="res-pts" style="color:${res.c}">${res.l} (+${res.p})</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }

        if (currentMode === 8) {
            display.className = 'stopwatch-display';
            display.textContent = 'RESULTS';
            display.style.color = '';
            const validHits = realActivePlayers().filter(p => modeData.hits[p.id] != null && !modeData.misfires[p.id]);
            // Sort valid hits by speed (fastest first) for tiered scoring
            const ranked = validHits.slice().sort((a, b) => modeData.hits[a.id] - modeData.hits[b.id]);
            const tierPoints = [1000, 700, 400, 200, 100];
            const rankMap = {};
            ranked.forEach((p, i) => { rankMap[p.id] = tierPoints[i] || 0; });
            html = `<div style="margin-bottom:10px;color:var(--text-dim)">Reflex Duel — Tiered Scoring</div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const misfired = !!modeData.misfires[p.id];
                const hit = modeData.hits[p.id];
                const pts = misfired || hit == null ? 0 : (rankMap[p.id] || 0);
                p.score += pts;
                const rank = ranked.findIndex(r => r.id === p.id);
                let label = misfired ? 'MISFIRE' : (hit == null ? 'NO TAP' : `${hit.toFixed(0)}ms`);
                const rankLabel = pts > 0 ? (rank === 0 ? '1st' : rank === 1 ? '2nd' : rank === 2 ? '3rd' : `${rank + 1}th`) : '';
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${label}</div>
                        <div class="res-note">${misfired ? 'Too early!' : (rankLabel ? rankLabel + (rank === 0 ? ' — Fastest!' : '') : '')}</div>
                        <div class="res-pts ${pts === 0 ? 'zero' : ''}">${rankLabel ? rankLabel + ' ' : ''}+${pts}</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }

        if (currentMode === 3) {
            display.className = 'stopwatch-display';
            display.textContent = 'DONE';
            const variantLabel = modeData.variant === 'sabotage' ? 'Master Sabotage' : 'Individual Laps';
            html = `<div style="margin-bottom:10px;color:var(--text-dim)">Relay complete — ${variantLabel} — ${modeData.laps} lap${modeData.laps === 1 ? '' : 's'}.</div><div class="result-grid">`;
            realActivePlayers().forEach(p => {
                const pts = modeData.scores[p.id] || 0;
                p.score += pts;
                const playerTurns = modeData.turns.filter(t => t.pId === p.id);
                let turnDetails = '';
                if (modeData.variant === 'sabotage') {
                    turnDetails = playerTurns.map(t => {
                        const icon = t.tapTiming === 'EARLY' ? '⚡' : (t.tapTiming === 'LATE' ? '🐢' : '✓');
                        return `${icon} ${fmt(t.diff)}s off`;
                    }).join(', ');
                } else {
                    turnDetails = playerTurns.map(t => {
                        const icon = t.tapTiming === 'EARLY' ? '⚡' : (t.tapTiming === 'LATE' ? '🐢' : '✓');
                        return `${icon} ${fmt(t.diff)}s off`;
                    }).join(', ');
                }
                html += `
                    <div class="res-card">
                        <div class="res-name" style="color:var(${p.var})">${safe(p.name)}</div>
                        <div class="res-val">${pts}</div>
                        <div class="res-note">${playerTurns.length} turn${playerTurns.length === 1 ? '' : 's'}${turnDetails ? ' — ' + turnDetails : ''}</div>
                        <div class="res-pts">+${pts}</div>
                    </div>`;
            });
            html += `</div>`;
            return showEndScreen(html);
        }
    }

    document.addEventListener('keydown', event => {
        if (event.repeat) return;
        const k = event.key.toLowerCase();
        const activeTag = document.activeElement?.tagName;
        const inputLocked = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag) && document.activeElement !== guessInput;
        if (inputLocked) return;
        if (k === ' ' || event.code === 'Space') {
            event.preventDefault();
            // If in lobby state, start the game
            if (document.body.classList.contains('state-lobby') && gs === STATE.MENU) {
                handleLobbyStart();
                return;
            }
            if (gs === STATE.MENU || gs === STATE.RESULT) handleMainAction();
            else if (gs === STATE.GUESSING) submitGuess();
            return;
        }
        if (gs === STATE.GUESSING && k === 'enter') {
            event.preventDefault();
            submitGuess();
            return;
        }
        if (gs === STATE.RUNNING) {
            const idx = KEYS.indexOf(k);
            if (idx !== -1 && idx < playerCount) arenaTap(idx + 1);
        }
    });

    guessInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            submitGuess();
        }
    });

    function init() {
        syncPlayerFlags();
        loadPrefs();
        const recoveredMatch = restoreMatchState();
        syncPlayerFlags();
        buildStaticUi();
        buildSettings();
        el('s-rounds').value = String(totalRounds);
        renderModeConfig();
        setGameState('lobby');
        if (recoveredMatch) {
            // Resume into arena state
            setGameState('arena');
            renderHud();
            resetUI();
            showToast('Match recovered!', 'var(--success)');
        }
    }

    init();
    </script>
</body>
</html>
