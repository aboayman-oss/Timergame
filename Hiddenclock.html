<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Hidden Clock — Master Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap');

        :root {
            --bg:          #07090f;
            --surface:     #0d1117;
            --surface2:    #141b27;
            --border:      #1d2840;
            --p1: #00d4ff; --p1-dim: rgba(0,212,255,0.15);
            --p2: #a78bfa; --p2-dim: rgba(167,139,250,0.15);
            --p3: #00ff87; --p3-dim: rgba(0,255,135,0.15);
            --p4: #ffbe00; --p4-dim: rgba(255,190,0,0.15);
            --p5: #ff3366; --p5-dim: rgba(255,51,102,0.15);
            --success:     #00ff87;
            --warn:        #ffbe00;
            --danger:      #ff3366;
            --text:        #e8f0fe;
            --text-dim:    #6b7fa3;
            --text-dimmer: #2e3f5c;
            --radius:      12px;
            --radius-lg:   20px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { min-height: 100%; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: env(safe-area-inset-top, 14px) 14px env(safe-area-inset-bottom, 14px);
            overflow-x: hidden;
            overflow-y: auto;
            transition: padding 0.4s ease;
        }

        /* ===== STATE-BASED LAYOUT ===== */
        body.state-arena { padding: 0; overflow: hidden; }
        body.state-transition { overflow: hidden; }

        /* Safe-area text insets for player buttons at screen edges */
        body.state-arena .arena-players-zone .player-btn {
            padding-left: max(8px, env(safe-area-inset-left, 0px));
            padding-right: max(8px, env(safe-area-inset-right, 0px));
        }
        /* Top-row buttons get top safe area inset */
        body.state-arena .arena-players-zone.players-1 .player-btn:first-child,
        body.state-arena .arena-players-zone.players-2 .player-btn:first-child,
        body.state-arena .arena-players-zone.players-3 .player-btn:first-child,
        body.state-arena .arena-players-zone.players-4 .player-btn:nth-child(1),
        body.state-arena .arena-players-zone.players-4 .player-btn:nth-child(2),
        body.state-arena .arena-players-zone.players-5 .player-btn:nth-child(1),
        body.state-arena .arena-players-zone.players-5 .player-btn:nth-child(2) {
            padding-top: max(16px, env(safe-area-inset-top, 0px));
        }
        /* Bottom-row buttons get bottom safe area inset */
        body.state-arena .arena-players-zone.players-1 .player-btn:last-child,
        body.state-arena .arena-players-zone.players-2 .player-btn:last-child,
        body.state-arena .arena-players-zone.players-3 .player-btn:nth-child(2),
        body.state-arena .arena-players-zone.players-3 .player-btn:nth-child(3),
        body.state-arena .arena-players-zone.players-4 .player-btn:nth-child(3),
        body.state-arena .arena-players-zone.players-4 .player-btn:nth-child(4),
        body.state-arena .arena-players-zone.players-5 .player-btn:nth-child(3),
        body.state-arena .arena-players-zone.players-5 .player-btn:nth-child(4),
        body.state-arena .arena-players-zone.players-5 .player-btn:nth-child(5) {
            padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
        }

        /* ===== HEADER ===== */
        .header {
            width: 100%; max-width: 500px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 14px;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        body.state-arena .header,
        body.state-transition .header { transform: translateY(-80px); opacity: 0; pointer-events: none; }
        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 5vw, 1.5rem); font-weight: 900;
            background: linear-gradient(90deg, var(--p1), var(--p2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0,212,255,0.2); letter-spacing: 0.05em;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
            width: 42px; height: 42px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
            transition: all 0.2s; touch-action: manipulation;
        }
        .icon-btn:hover, .icon-btn:active { background: var(--p1-dim); color: var(--p1); border-color: var(--p1); }
        .icon-btn svg, .icon-inline svg, .game-title svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .game-title svg { width: 20px; height: 20px; }
        .icon-inline {
            display: inline-flex; align-items: center; justify-content: center;
            vertical-align: middle; margin-right: 6px; color: inherit;
        }

        /* ===== LOBBY ===== */
        #lobby {
            width: 100%; max-width: 500px;
            display: flex; flex-direction: column; align-items: center; gap: 18px;
            flex: 1; justify-content: center;
            transition: transform 0.4s ease, opacity 0.35s ease;
        }
        body.state-arena #lobby,
        body.state-transition #lobby { transform: translateY(-40px) scale(0.95); opacity: 0; pointer-events: none; position: absolute; }

        .lobby-mode-grid {
            width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px;
        }
        .lobby-mode-card {
            background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 14px 12px; cursor: pointer; text-align: center;
            transition: all 0.2s; touch-action: manipulation;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .lobby-mode-card:hover, .lobby-mode-card:active { border-color: var(--p1); background: var(--p1-dim); }
        .lobby-mode-card.active { border-color: var(--p1); background: var(--p1-dim); box-shadow: 0 0 20px var(--p1-dim); }
        .lobby-mode-id {
            font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 900;
            color: var(--p1); opacity: 0.7;
        }
        .lobby-mode-card.active .lobby-mode-id { opacity: 1; }
        .lobby-mode-name { font-weight: 700; font-size: 0.82rem; color: var(--text); }
        .lobby-mode-card.active .lobby-mode-name { color: var(--p1); }
        .lobby-config-btn {
            position: absolute; top: 6px; right: 6px; width: 26px; height: 26px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
            color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; transition: all 0.2s; touch-action: manipulation;
        }
        .lobby-config-btn:hover { color: var(--p1); border-color: var(--p1); }
        .lobby-mode-wrapper { position: relative; }

        .lobby-player-selector {
            display: flex; gap: 6px; align-items: center; justify-content: center;
        }
        .lobby-player-btn {
            width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border);
            background: var(--surface2); color: var(--text-dim); font-family: 'Orbitron', sans-serif;
            font-size: 1rem; font-weight: 900; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; touch-action: manipulation;
        }
        .lobby-player-btn:hover { border-color: var(--p1); color: var(--p1); }
        .lobby-player-btn.active { border-color: var(--p1); background: var(--p1-dim); color: var(--p1); box-shadow: 0 0 15px var(--p1-dim); }
        .lobby-player-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 0.1em; }

        .lobby-start-btn {
            width: 100%; max-width: 320px; padding: 22px 40px;
            font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900;
            letter-spacing: 0.15em; text-transform: uppercase;
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(167,139,250,0.2));
            border: 2px solid var(--p1); color: var(--p1); border-radius: 16px;
            cursor: pointer; touch-action: manipulation; position: relative; overflow: hidden;
            transition: all 0.25s ease;
            animation: lobbyPulse 2.5s ease-in-out infinite;
        }
        .lobby-start-btn:hover, .lobby-start-btn:active {
            background: linear-gradient(135deg, rgba(0,212,255,0.35), rgba(167,139,250,0.35));
            box-shadow: 0 0 40px var(--p1-dim), 0 0 80px rgba(0,212,255,0.1);
            transform: scale(1.03);
        }
        .lobby-start-btn:active { transform: scale(0.97); }
        @keyframes lobbyPulse {
            0%,100% { box-shadow: 0 0 15px var(--p1-dim); }
            50% { box-shadow: 0 0 35px var(--p1), 0 0 70px var(--p1-dim); }
        }

        /* ===== HUD (Score Strip) ===== */
        .hud {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: center; gap: 2px;
            padding: env(safe-area-inset-top, 4px) 4px 4px;
            z-index: 80; opacity: 0; transform: translateY(-100%);
            transition: all 0.4s ease; pointer-events: none;
        }
        body.state-arena .hud { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .hud-score {
            flex: 1; max-width: 100px; padding: 4px 8px; text-align: center;
            background: var(--surface); border-bottom: 3px solid var(--border);
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.03em;
        }
        .hud-score-name { opacity: 0.7; font-size: 0.55rem; text-transform: uppercase; }
        .hud-score-pts { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 900; }
        .hud-round {
            padding: 4px 10px; background: var(--surface); color: var(--text-dim);
            font-size: 0.6rem; font-weight: 700; display: flex; align-items: center; gap: 4px;
        }

        /* ===== ARENA CONTAINER ===== */
        #arena-container {
            display: none; position: fixed; inset: 0; z-index: 50;
            background: var(--bg); flex-direction: column;
            padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
        }
        body.state-arena #arena-container { display: flex; }

        .arena-timer-zone {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 14px; flex-shrink: 0;
            /* Reserve space below the fixed HUD scoreboard in portrait mode */
            padding-top: calc(env(safe-area-inset-top, 4px) + 48px);
            overflow-y: auto; -webkit-overflow-scrolling: touch; max-height: 100vh; max-height: 100dvh;
        }
        .arena-players-zone {
            flex: 1; display: grid; gap: 6px; padding: 6px;
            min-height: 0;
        }
        /* Mobile portrait: stack players vertically */
        .arena-players-zone.players-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .arena-players-zone.players-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .arena-players-zone.players-3 .player-btn:first-child { grid-column: span 2; }
        .arena-players-zone.players-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .arena-players-zone.players-5 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
        .arena-players-zone.players-5 .player-btn:last-child { grid-column: span 2; }
        .arena-players-zone.players-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }

        /* ===== TABLET LANDSCAPE ===== */
        @media (min-width: 768px) and (orientation: landscape) {
            #arena-container {
                flex-direction: row; flex-wrap: wrap;
            }
            .arena-timer-zone {
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                z-index: 60; padding: 24px 32px; pointer-events: none;
                background: radial-gradient(ellipse, var(--bg) 70%, transparent 100%);
                border-radius: var(--radius-lg);
                width: auto; min-width: 300px; max-width: 520px;
                height: auto; min-height: 200px; max-height: 80vh;
                overflow-y: auto; -webkit-overflow-scrolling: touch;
                padding-top: 24px;
            }
            .arena-timer-zone * { pointer-events: auto; }
            .arena-players-zone {
                position: absolute; inset: 0;
                padding: 12px;
                /* Reserve center space for the timer zone */
                gap: 180px 280px;
            }
            .arena-players-zone.players-2 {
                grid-template-columns: 1fr 1fr; grid-template-rows: 1fr;
            }
            .arena-players-zone.players-2 .player-btn:first-child { border-radius: 16px 0 0 16px; }
            .arena-players-zone.players-2 .player-btn:last-child { border-radius: 0 16px 16px 0; }
            .arena-players-zone.players-3 {
                grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            }
            .arena-players-zone.players-3 .player-btn:first-child { grid-column: span 2; }
            .arena-players-zone.players-4 {
                grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            }
            .arena-players-zone.players-5 {
                grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr;
            }
            .arena-players-zone.players-5 .player-btn:nth-child(4) { grid-column: 1 / 2; }
            .arena-players-zone.players-5 .player-btn:nth-child(5) { grid-column: 2 / 4; }

            /* Radial text rotation for tablet */
            .arena-players-zone.players-4 .player-btn:nth-child(1),
            .arena-players-zone.players-4 .player-btn:nth-child(2),
            .arena-players-zone.players-3 .player-btn:first-child,
            .arena-players-zone.players-2 .player-btn:first-child,
            .arena-players-zone.players-5 .player-btn:nth-child(1),
            .arena-players-zone.players-5 .player-btn:nth-child(2),
            .arena-players-zone.players-5 .player-btn:nth-child(3) { transform: rotate(180deg); }
            .arena-players-zone.players-4 .player-btn:nth-child(1) .pb-name,
            .arena-players-zone.players-4 .player-btn:nth-child(1) .pb-stat,
            .arena-players-zone.players-4 .player-btn:nth-child(1) .pb-sub,
            .arena-players-zone.players-4 .player-btn:nth-child(2) .pb-name,
            .arena-players-zone.players-4 .player-btn:nth-child(2) .pb-stat,
            .arena-players-zone.players-4 .player-btn:nth-child(2) .pb-sub,
            .arena-players-zone.players-3 .player-btn:first-child .pb-name,
            .arena-players-zone.players-3 .player-btn:first-child .pb-stat,
            .arena-players-zone.players-3 .player-btn:first-child .pb-sub,
            .arena-players-zone.players-2 .player-btn:first-child .pb-name,
            .arena-players-zone.players-2 .player-btn:first-child .pb-stat,
            .arena-players-zone.players-2 .player-btn:first-child .pb-sub,
            .arena-players-zone.players-5 .player-btn:nth-child(1) .pb-name,
            .arena-players-zone.players-5 .player-btn:nth-child(1) .pb-stat,
            .arena-players-zone.players-5 .player-btn:nth-child(1) .pb-sub,
            .arena-players-zone.players-5 .player-btn:nth-child(2) .pb-name,
            .arena-players-zone.players-5 .player-btn:nth-child(2) .pb-stat,
            .arena-players-zone.players-5 .player-btn:nth-child(2) .pb-sub,
            .arena-players-zone.players-5 .player-btn:nth-child(3) .pb-name,
            .arena-players-zone.players-5 .player-btn:nth-child(3) .pb-stat,
            .arena-players-zone.players-5 .player-btn:nth-child(3) .pb-sub { transform: rotate(180deg); }
        }

        /* ===== LEGACY STYLES (kept for compatibility) ===== */
        .mode-btn {
            background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
            height: 42px; padding: 0 14px; border-radius: 10px; cursor: pointer;
            display: none; align-items: center; gap: 6px; font-family: 'Exo 2', sans-serif;
            font-weight: 700; font-size: 0.82rem; transition: all 0.2s; touch-action: manipulation;
            white-space: nowrap;
        }
        .mode-btn-label { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

        .mode-list { display: grid; gap: 8px; }
        .mode-card {
            background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px 14px; cursor: pointer; transition: all 0.2s; touch-action: manipulation;
            display: flex; align-items: flex-start; gap: 12px;
        }
        .mode-card:hover, .mode-card:active { border-color: var(--p1); background: var(--p1-dim); }
        .mode-card.active { border-color: var(--p1); background: var(--p1-dim); }
        .mode-card-id {
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 900;
            color: var(--p1); background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2);
            border-radius: 6px; padding: 4px 7px; flex-shrink: 0; margin-top: 1px;
        }
        .mode-card.active .mode-card-id { background: rgba(0,212,255,0.2); }
        .mode-card-body { flex: 1; min-width: 0; }
        .mode-card-name { font-weight: 700; font-size: 0.9rem; color: var(--text); margin-bottom: 3px; }
        .mode-card.active .mode-card-name { color: var(--p1); }
        .mode-card-desc { font-size: 0.78rem; color: var(--text-dim); line-height: 1.4; }

        .scoreboard {
            width: 100%; max-width: 500px;
            display: none; justify-content: space-evenly; flex-wrap: wrap; gap: 8px;
            margin-bottom: 10px;
        }
        .score-card {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 8px; padding: 6px 12px; text-align: center;
            min-width: 80px; flex: 1; transition: transform 0.2s;
        }
        .score-card.lead { box-shadow: 0 0 24px rgba(255,190,0,0.1); transform: translateY(-2px); }
        .score-name { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
        .score-pts { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; }

        .round-progress {
            width: 100%; max-width: 500px; display: none; justify-content: center; gap: 6px;
            margin-bottom: 12px; min-height: 10px;
        }
        .round-pip {
            width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border);
            background: var(--surface2); color: var(--text-dim); font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .round-pip.done { border-color: var(--p1); background: var(--p1-dim); color: var(--p1); box-shadow: 0 0 15px var(--p1-dim); }

        .game-container {
            width: 100%; max-width: 500px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 18px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6); position: relative;
            touch-action: manipulation; display: none;
        }
        body.state-arena .game-container { display: none; }

        .config-area {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .config-full { grid-column: span 2; }
        .config-item { display: flex; flex-direction: column; gap: 5px; }
        .config-item label { font-size: 0.68rem; color: var(--text-dim); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
        .config-item input, .config-item select {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 11px 10px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 1rem; text-align: center;
            width: 100%; transition: border-color 0.2s; appearance: none;
        }
        .config-item input:focus, .config-item select:focus, .guess-input:focus, .player-row input:focus {
            outline: none; border-color: var(--p1); box-shadow: 0 0 0 2px var(--p1-dim);
        }
        .mode-desc {
            grid-column: span 2; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(0,0,0,0.08));
        }
        .mode-desc h3 {
            font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--p1); margin-bottom: 6px;
        }
        .mode-desc p { color: var(--text-dim); font-size: 0.85rem; line-height: 1.45; }
        .config-note { grid-column: span 2; text-align: center; font-size: 0.75rem; color: var(--text-dim); }
        .difficulty-presets { grid-column: span 2; display: flex; gap: 8px; margin-bottom: 4px; }
        .preset-btn { flex: 1; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); font-family: 'Exo 2', sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; touch-action: manipulation; }
        .preset-btn:hover { border-color: var(--p1); color: var(--p1); }
        .preset-btn.active { background: var(--p1-dim); border-color: var(--p1); color: var(--p1); }

        .player-btn {

        .pb-name { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; z-index: 2; pointer-events: none; }

        .btn {
            background: var(--text); color: var(--bg); border: none; padding: 16px;

        .btn-primary {

        .btn-danger { background: var(--danger); color: #fff; }

        #main-action { margin-top: 14px; }
        .restart-wrap { margin-top: 8px; text-align: center; min-height: 22px; }

            display: none; color: var(--text-dim); font-size: 0.84rem; text-decoration: none; border-bottom: 1px dashed currentColor;

        }
        .restart-link.show { display: inline-block; }

        .ripple { position:absolute; border-radius:50%; transform:scale(0); animation:rippleAnim 0.5s linear; background:rgba(255,255,255,0.25); pointer-events:none; }
        @keyframes rippleAnim { to { transform:scale(4); opacity:0; } }

        .result-panel {
            margin-top: 14px; padding: 16px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: var(--radius);

        .res-card { background: var(--bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .res-name { font-weight: 700; font-size: 0.8rem; margin-bottom: 4px; }
        .res-val { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; }
        .res-pts { color: var(--success); font-size: 0.75rem; font-weight: 700; margin-top: 4px; }

        .res-note { font-size: 0.7rem; opacity: 0.7; margin-top: 4px; }
        .winner-banner {
            font-size: 1.3rem; font-weight: 900; color: var(--warn); margin-bottom: 15px; text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 8px;
        }

        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            z-index: 200; display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.3s;
        }
        .modal-backdrop.open { opacity: 1; pointer-events: all; visibility: visible; }
        .modal-sheet {
            width: 100%; max-width: 500px; background: var(--surface); border: 1px solid var(--border);

            padding: 22px 22px 40px; transform: translateY(100%); transition: transform 0.35s;
            max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
        }
        .modal-backdrop.open .modal-sheet { transform: translateY(0); }
        .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 10px; }
        .settings-group, .help-card { background: var(--surface2); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .settings-title { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.05em; }
        .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .p-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
        .player-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-family: 'Exo 2', sans-serif; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
        .toggle-label { display: inline-flex; align-items: center; gap: 8px; }
        .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-track { position: absolute; inset: 0; background: var(--border); border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .toggle-track::before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: var(--text-dim); border-radius: 50%; transition: 0.3s; }
        .toggle input:checked + .toggle-track { background: var(--p1-dim); border: 1px solid var(--p1); }
        .toggle input:checked + .toggle-track::before { transform: translateX(20px); background: var(--p1); }

        .help-list { display: grid; gap: 10px; }
        .help-card h4 { font-size: 0.9rem; margin-bottom: 4px; color: var(--text); }
        .help-card p { font-size: 0.82rem; color: var(--text-dim); line-height: 1.45; }
        .kb-hint { font-size: 0.7rem; color: var(--text-dimmer); text-align: center; margin-top: 10px; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%,90%{transform:translate3d(-2px,0,0)} 20%,80%{transform:translate3d(4px,0,0)} 30%,50%,70%{transform:translate3d(-6px,0,0)} 40%,60%{transform:translate3d(6px,0,0)} }

        .bust-flash { animation: bustFlash 0.6s ease-out; }
        @keyframes bustFlash { 0%{background:var(--danger);transform:scale(1.1)} 50%{background:rgba(255,51,102,0.4)} 100%{background:var(--bg);transform:scale(1)} }

        .pulse-glow { animation: pulseGlow 1.5s ease-in-out infinite; }
        @keyframes pulseGlow { 0%,100%{box-shadow:0 0 10px var(--p1-dim)} 50%{box-shadow:0 0 30px var(--p1), 0 0 60px var(--p1-dim)} }

        .pulse-active { animation: pulseActive 0.6s ease-in-out infinite alternate; }
        @keyframes pulseActive { 0%{transform:scale(1);box-shadow:0 0 10px currentColor} 100%{transform:scale(1.06);box-shadow:0 0 25px currentColor, 0 0 50px currentColor} }

        .heartbeat-pulse { animation: heartbeat 1s ease-in-out infinite; }
        @keyframes heartbeat { 0%,100%{transform:scale(1);opacity:0.6} 14%{transform:scale(1.15);opacity:1} 28%{transform:scale(1);opacity:0.6} 42%{transform:scale(1.1);opacity:0.9} 56%{transform:scale(1);opacity:0.6} }

        .distraction-flash { animation: distractFlash 0.15s ease-out; }
        @keyframes distractFlash { 0%{filter:brightness(2) invert(0.1)} 100%{filter:none} }

        .echo-bar { height: 8px; background: var(--p1); border-radius: 4px; transition: width 0.1s linear; width: 0%; }
        .echo-bar-track { width: 100%; background: var(--surface2); border-radius: 4px; border: 1px solid var(--border); margin: 10px 0; overflow: hidden; }

        .rankings-flash { position: absolute; inset: 0; background: rgba(0,0,0,0.9); border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; animation: fadeInOut 2s ease-in-out forwards; }
        @keyframes fadeInOut { 0%{opacity:0} 10%{opacity:1} 80%{opacity:1} 100%{opacity:0} }

        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; animation: pDrop 1.5s ease-in forwards; }
        @keyframes pDrop { 0% { opacity:1; transform: translateY(0) scale(1); } 100% { opacity:0; transform: translateY(80vh) scale(0); } }

        @media (max-width: 400px) {
            .game-container { padding: 14px; }
            .stopwatch-display { font-size: 2.5rem; }
            .lobby-mode-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body class="state-lobby">
    <div class="header">
        <div class="game-title" id="game-title"></div>
        <div class="header-actions">
            <button class="mode-btn" onclick="openModes()" aria-label="Select game mode" id="mode-btn">
                <span id="mode-btn-label" class="mode-btn-label"></span>
            </button>
            <button class="icon-btn" onclick="openHelp()" aria-label="How to play">?</button>

        </div>
    </div>

    <!-- LOBBY STATE -->
    <div id="lobby">
        <div class="lobby-mode-grid" id="lobby-mode-grid"></div>

            <div class="lobby-player-label">PLAYERS</div>
            <div class="lobby-player-selector" id="lobby-player-selector"></div>
        </div>

    </div>

    <!-- HUD (shown during arena) -->
    <div class="hud" id="hud"></div>

    <!-- ARENA CONTAINER (fullscreen during gameplay) -->
    <div id="arena-container">
        <div class="arena-timer-zone" id="arena-timer-zone">
            <div class="status-text" id="status-text">Ready to play!</div>
            <div class="stopwatch-display" id="display">00.000</div>
            <div id="heartbeat-indicator" style="display:none;width:20px;height:20px;border-radius:50%;background:var(--p1);margin:0 auto 10px;"></div>
            <div class="guess-stage" id="guess-stage">
                <h3 id="guess-prompt" style="color:var(--text-dim);font-size:0.8rem;text-transform:uppercase;margin-bottom:8px;">Guess</h3>
                <div id="guess-inputs-all"></div>
                <input type="text" class="guess-input" id="guess-input" placeholder="0.000" style="display:none;" readonly inputmode="none">
                <button class="btn btn-primary" onclick="submitGuess(event)" style="padding:12px;font-size:0.9rem;" id="guess-confirm-btn">Confirm</button>
            </div>
            <!-- Custom In-Game Number Pad -->
            <div class="game-numpad" id="game-numpad">
                <div class="numpad-grid">
                    <button class="numpad-btn" data-key="1">1</button>
                    <button class="numpad-btn" data-key="2">2</button>
                    <button class="numpad-btn" data-key="3">3</button>
                    <button class="numpad-btn" data-key="4">4</button>
                    <button class="numpad-btn" data-key="5">5</button>
                    <button class="numpad-btn" data-key="6">6</button>
                    <button class="numpad-btn" data-key="7">7</button>
                    <button class="numpad-btn" data-key="8">8</button>
                    <button class="numpad-btn" data-key="9">9</button>
                    <button class="numpad-btn" data-key=".">.</button>

            <div id="main-action">
                <button class="btn btn-primary" onclick="handleMainAction(event)" id="main-btn"></button>
            </div>
            <div class="restart-wrap"><a class="restart-link" id="restart-link" onclick="quickRestart(event)">↺ Restart Match</a></div>

        <div class="arena-players-zone" id="arena"></div>

        </div>

                    <select id="s-pcount" style="background:var(--bg);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:4px;" onchange="updatePlayerCount()">

    <div class="particles" id="particles"></div>

    /* ===== CUSTOM NUMPAD LOGIC ===== */
    let numpadTarget = null; // the input element the numpad is currently targeting

    function numpadShow(inputEl) {
        numpadTarget = inputEl;
        if (inputEl) inputEl.classList.add('numpad-active');
        gameNumpad.classList.add('show');
    }
    function numpadHide() {
        if (numpadTarget) numpadTarget.classList.remove('numpad-active');
        numpadTarget = null;
        gameNumpad.classList.remove('show');
    }
    function numpadPress(key) {
        if (!numpadTarget) return;
        let val = numpadTarget.value || '';
        if (key === 'del') {
            val = val.slice(0, -1);
        } else if (key === '.') {
            if (val.includes('.')) return; // only one decimal
            if (val === '') val = '0.';
            else val += '.';
        } else {
            // Limit length to prevent absurd entries
            if (val.replace('.', '').length >= 6) return;
            val += key;
        }
        numpadTarget.value = val;
        // Trigger input event so any listeners fire
        numpadTarget.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function clearTimers() {
        timeoutHandles.forEach(clearTimeout);

    function liveDisplay(step) {

    function syncPlayerFlags() {

    function getPts(diff, maxPts = 1000, decayRate = 1.5, playerId = null) {
        // Rubber-banding: players in last place get a more forgiving decay rate
        let adjustedDecay = decayRate;
        if (playerId != null && playerCount > 1) {
            const pool = realActivePlayers();
            const maxScore = Math.max(...pool.map(p => p.score), 0);
            const myScore = (pool.find(p => p.id === playerId) || {}).score || 0;
            if (maxScore > 0) {
                const deficit = (maxScore - myScore) / maxScore; // 0 = leading, 1 = far behind
                // Up to 60% more forgiving decay for last place players
                adjustedDecay = decayRate * (1 + deficit * 0.6);
            }
        }
        const score = Math.round(maxPts * Math.exp(-diff / (adjustedDecay * 1000)));
        let label, color;
        if (score >= 900) { label = 'PERFECT'; color = 'var(--warn)'; }
        else if (score >= 600) { label = 'GREAT'; color = 'var(--success)'; }
        else if (score >= 300) { label = 'GOOD'; color = 'var(--p1)'; }
        else { label = 'MISS'; color = 'var(--danger)'; }
        return { p: score, l: label, c: color };
    }

    let _audioCtx = null;
    function getAudioCtx() {
        if (!_audioCtx || _audioCtx.state === 'closed') {
            _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (_audioCtx.state === 'suspended') _audioCtx.resume();
        return _audioCtx;
    }

    function snd(type) {
        if (!el('s-sound').checked) return;
        try {
            const ac = getAudioCtx();
            const t = ac.currentTime;
            const play = (f, d, w='sine', v=0.2, dt=0) => {
                const o = ac.createOscillator(), g = ac.createGain();
                o.connect(g); g.connect(ac.destination); o.type = w; o.frequency.value = f;
                g.gain.setValueAtTime(v, t + dt); g.gain.exponentialRampToValueAtTime(0.001, t + dt + d);
                o.start(t + dt); o.stop(t + dt + d + 0.1);
            };
            const map = {
                tick: () => play(600, 0.05, 'sine', 0.1),
                go: () => { play(660, 0.05); play(880, 0.1, 'sine', 0.2, 0.1); },
                tap: () => play(300, 0.05, 'square', 0.1),
                good: () => { play(660, 0.1); play(880, 0.2, 'sine', 0.2, 0.1); },
                perf: () => { play(880, 0.1); play(1100, 0.1, 'sine', 0.2, 0.1); play(1320, 0.3, 'sine', 0.2, 0.2); },
                bad: () => { play(250, 0.1, 'sawtooth', 0.15); play(200, 0.2, 'sawtooth', 0.15, 0.1); },
                exp: () => play(100, 0.5, 'square', 0.3)
            };
            if (map[type]) map[type]();
        } catch (e) {}

        const r = document.createElement('span');
        r.className = 'ripple';
        const rect = target.getBoundingClientRect();
        const sz = Math.max(rect.width, rect.height) * 2;
        r.style.cssText = `width:${sz}px;height:${sz}px;left:${(e.clientX || rect.left + rect.width / 2) - rect.left - sz / 2}px;top:${(e.clientY || rect.top + rect.height / 2) - rect.top - sz / 2}px;`;
        target.appendChild(r);
        setTimeout(() => r.remove(), 500);
    }

    function spawnConfetti() {

        for (let i = 0; i < 40; i++) {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'particle';
                const s = 5 + Math.random() * 8;
                p.style.cssText = `left:${Math.random() * 100}vw; top:-10px; width:${s}px; height:${s}px; background:${HEX[Math.floor(Math.random() * HEX.length)]}; animation-duration:${1 + Math.random()}s;`;
                c.appendChild(p);
                setTimeout(() => p.remove(), 2000);
            }, i * 20);
        }
    }

    function savePrefs() {
        const payload = {
            playerCount,
            names: players.map(p => p.name),
            sound: el('s-sound')?.checked ?? true,
            haptic: el('s-haptic')?.checked ?? true,
            lastMode: currentMode
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }
    function loadPrefs() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const prefs = JSON.parse(raw);
            if (prefs.playerCount) playerCount = clamp(parseInt(prefs.playerCount, 10) || 2, 1, 5);
            if (Array.isArray(prefs.names)) prefs.names.slice(0, 5).forEach((name, i) => { if (name) players[i].name = String(name).slice(0, 8); });
            syncPlayerFlags();
            if (typeof prefs.sound === 'boolean') el('s-sound').checked = prefs.sound;
            if (typeof prefs.haptic === 'boolean') el('s-haptic').checked = prefs.haptic;
            if (prefs.lastMode && MODES[prefs.lastMode]) currentMode = Number(prefs.lastMode);
        } catch (e) {}
    }
    function saveMatchState() {
        if (currentRound > totalRounds) {
            clearMatchState();
            return;
        }
        const payload = {
            currentMode,
            currentRound,
            totalRounds,
            playerCount,
            scores: players.map(p => ({ id: p.id, name: p.name, score: p.score })),
            timestamp: Date.now()
        };
        localStorage.setItem(MATCH_STATE_KEY, JSON.stringify(payload));
    }
    function clearMatchState() {
        localStorage.removeItem(MATCH_STATE_KEY);
    }
    function restoreMatchState() {
        try {
            const raw = localStorage.getItem(MATCH_STATE_KEY);
            if (!raw) return false;
            const saved = JSON.parse(raw);
            if (!saved || !MODES[saved.currentMode]) return false;
            if ((parseInt(saved.currentRound, 10) || 1) > (parseInt(saved.totalRounds, 10) || 1)) {
                clearMatchState();
                return false;
            }
            currentMode = Number(saved.currentMode);
            currentRound = clamp(parseInt(saved.currentRound, 10) || 1, 1, 99);
            totalRounds = clamp(parseInt(saved.totalRounds, 10) || 3, 1, 99);
            playerCount = clamp(parseInt(saved.playerCount, 10) || 2, 1, 5);
            if (Array.isArray(saved.scores)) {
                saved.scores.slice(0, 5).forEach((entry, i) => {
                    if (!entry) return;
                    players[i].name = String(entry.name || players[i].name).slice(0, 8);
                    players[i].score = parseInt(entry.score, 10) || 0;
                });
            }
            syncPlayerFlags();
            return true;
        } catch (e) {
            clearMatchState();
            return false;
        }
    }

    function setGameState(state) {
        document.body.classList.remove('state-lobby', 'state-transition', 'state-arena');
        document.body.classList.add(`state-${state}`);
        if (state === 'arena') {
            // Request fullscreen
            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            } catch(e) {}
            // Wake Lock
            requestWakeLock();
        } else if (state === 'lobby') {
            releaseWakeLock();
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
        }
    }

    let _wakeLock = null;
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                _wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch(e) {}
    }
    function releaseWakeLock() {
        if (_wakeLock) { _wakeLock.release().catch(() => {}); _wakeLock = null; }
    }

        const modeGrid = el('lobby-mode-grid');
        modeGrid.innerHTML = Object.entries(MODES).map(([id, mode]) => (
            `<div class="lobby-mode-wrapper">

                    <div class="lobby-mode-name">${safe(mode.short)}</div>

                <button class="lobby-config-btn" onclick="event.stopPropagation();selectLobbyMode(${id});openConfigModal()" title="Configure">⚙</button>

        const pSelector = el('lobby-player-selector');
        pSelector.innerHTML = [1,2,3,4,5].map(n => (

    function buildSettings() {
        el('s-pcount').value = String(playerCount);
        const pInputs = el('player-inputs');
        pInputs.innerHTML = '';
        players.slice(0, playerCount).forEach((p, i) => {
            const row = document.createElement('div');
            row.className = 'player-row';
            row.innerHTML = `<div class="p-color-dot" style="background:${p.color}"></div><input type="text" maxlength="8">`;
            const input = row.querySelector('input');
            input.value = p.name;
            input.addEventListener('input', ev => {
                players[i].name = (ev.target.value || `P${i + 1}`).slice(0, 8);
                renderScoreboard();
                updateKbHint();
                savePrefs();
            });
            input.addEventListener('blur', ev => {
                if (!ev.target.value.trim()) {
                    ev.target.value = `P${i + 1}`;
                    players[i].name = ev.target.value;
                    renderScoreboard();
                    savePrefs();
                }
            });
            pInputs.appendChild(row);
        });
    }

    function renderScoreboard() {
        const board = el('scoreboard');
        const currentPlayers = realActivePlayers();
        const maxScore = Math.max(...currentPlayers.map(p => p.score), 0);
        board.innerHTML = currentPlayers.map(p => `
            <div class="score-card${p.score === maxScore && maxScore > 0 ? ' lead' : ''}" style="border-bottom: 3px solid var(${p.var})">
                <div class="score-name" style="color:var(${p.var})">${safe(p.name)}</div>
                <div class="score-pts">${p.score}</div>
            </div>`).join('');

    function renderProgress() {

    function updateKbHint() {
        if (gs === STATE.GUESSING) {
            el('kb-hint').innerHTML = 'Type your guess and press SPACE or ENTER to confirm';
            return;
        }
        if (gs === STATE.RUNNING) {
            const rendered = [...arena.querySelectorAll('.player-btn')].map(btn => {
                const id = Number(btn.dataset.pid);
                const player = players.find(p => p.id === id);
                return `<span style="color:var(${player.var})">[${KEYS[id - 1].toUpperCase()}] ${safe(player.name)}</span>`;
            }).join(' &nbsp; ');
            el('kb-hint').innerHTML = rendered || 'SPACE to start/confirm';
            return;
        }
        el('kb-hint').innerHTML = 'SPACE to start/confirm';
    }

    function renderArena(ids = realActivePlayers().map(p => p.id), subtitleFn = p => `Tap or ${KEYS[p.id - 1].toUpperCase()}`, statFn = () => 'READY') {
        arena.innerHTML = '';
        arena.className = `arena-players-zone players-${ids.length}`;
        ids.forEach(id => {
            const p = players.find(player => player.id === id);
            if (!p) return;
            arena.innerHTML += `
                <button class="player-btn" data-pid="${p.id}" id="btn-p${p.id}" style="color:var(${p.var})">
                    <span class="pb-name">${safe(p.name)}</span>
                    <span class="pb-stat" id="stat-p${p.id}">${safe(statFn(p))}</span>
                    <span class="pb-sub" id="sub-p${p.id}">${safe(subtitleFn(p))}</span>
                </button>`;
        });
        attachArenaListeners();
        arena.classList.toggle('hidden', ids.length === 0);
    }

    function attachArenaListeners() {
        arena.querySelectorAll('.player-btn').forEach(btn => {
            btn.addEventListener('pointerdown', function(e) {
                const pId = Number(this.dataset.pid);
                arenaTap(pId, e);
            });
        });

    function showToast(text, color = '') {
        statusText.textContent = text;
        statusText.style.color = color;
    }

    function startNumericCountdown(onComplete) {
        gs = STATE.CD;
        el('mode-btn').disabled = true;
        el('mode-btn').style.opacity = '0.4';
        el('main-action').style.display = 'none';
        resultPanel.classList.remove('show');
        arena.classList.add('hidden');
        let count = 3;
        display.className = 'stopwatch-display small';
        display.textContent = '3';
        showToast('GET READY');
        snd('tick'); hap([12]);
        const tick = () => {
            count -= 1;
            if (count > 0) {
                display.className = 'stopwatch-display small';
                void display.offsetWidth;
                display.classList.add('cd-pop');
                display.textContent = String(count);
                showToast('GET READY');
                snd('tick'); hap([12]);
                addTimeout(tick, 1000);
            } else {
                snd('go'); hap([10, 25, 40]);
                onComplete();
            }
        };
        addTimeout(tick, 1000);
    }

    function startCountdown() {
        startNumericCountdown(() => launchMode());
    }

    function handleMainAction(e) {
        if (e) ripple(e, mainBtn);
        if (gs === STATE.MENU) startCountdown();
        else if (gs === STATE.RESULT) {
            if (currentRound > totalRounds) {
                resetMatch();
                returnToLobby();
            } else {
                resetUI();
                startCountdown();
            }
        }
    }

    function quickRestart(e) {
        if (e) e.preventDefault();
        resetMatch();
        returnToLobby();
    }

    function arenaTap(pId, e) {
        if (gs !== STATE.RUNNING) return;
        const btn = el(`btn-p${pId}`);
        if (!btn || btn.disabled) return;
        if (e) ripple(e, btn);
        hap([20]); snd('tap');

        if (currentMode === 2) return precisionHit(pId);
        if (currentMode === 1) return manualPredictHit(pId);
        if (currentMode === 3) return relayHit(pId);
        if (currentMode === 4) return bombHit(pId);
        if (currentMode === 5) return zenithHit(pId);
        if (currentMode === 6) return predictTapHit(pId);
        if (currentMode === 7) return blindHit(pId);
        if (currentMode === 8) return duelHit(pId);
    }

    function sanitizeRange(minId, maxId, defaults) {
        let min = parseFloat(el(minId)?.value ?? defaults.min);
        let max = parseFloat(el(maxId)?.value ?? defaults.max);
        if (Number.isNaN(min)) min = defaults.min;
        if (Number.isNaN(max)) max = defaults.max;
        if (min > max) [min, max] = [max, min];
        return [min, max];
    }

    function launchMode() {
        clearTimers();
        gs = STATE.RUNNING;
        startTime = performance.now();
        const ids = realActivePlayers().map(p => p.id);

        if (currentMode === 1) {
            display.textContent = '??.???';
            display.classList.add('hidden-timer');
            const [minS, maxS] = sanitizeRange('m1-min', 'm1-max', { min: 3, max: 8 });
            modeData.target = rand(minS * 1000, maxS * 1000);
            modeData.stopped = false;
            showToast('Clock is running... invisibly!');
            snd('go');
            // Subtle audio-only heartbeat cue (no visual circle)
            modeData.heartbeatAc = null;
            try {
                const ac = getAudioCtx();
                modeData.heartbeatAc = ac;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain); gain.connect(ac.destination);
                osc.type = 'sine'; osc.frequency.value = 1.5;
                gain.gain.value = 0.04;
                const lfo = ac.createOscillator();
                const lfoGain = ac.createGain();
                lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
                lfo.frequency.value = 0.3 + Math.random() * 0.5;
                lfoGain.gain.value = 0.8;
                lfo.start(); osc.start();
                modeData.heartbeatOsc = osc;
                modeData.heartbeatLfo = lfo;
            } catch(e) {}
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                if (elapsed >= modeData.target && !modeData.stopped) {
                    modeData.stopped = true;
                    modeData.actual = elapsed;
                    clearTimers();
                    snd('bad');
                    if (modeData.heartbeatOsc) { try { modeData.heartbeatOsc.stop(); } catch(e){} }
                    if (modeData.heartbeatLfo) { try { modeData.heartbeatLfo.stop(); } catch(e){} }
                    // Manual input: players type their guess and press Lock
                    gs = STATE.RUNNING;
                    modeData.guesses = {};
                    modeData.lockedCount = 0;
                    display.className = 'stopwatch-display';
                    display.textContent = 'TIME\'S UP';
                    showToast('Type your guess and press Lock!', 'var(--success)');
                    // Build manual input UI for each player
                    arena.className = `arena-players-zone players-${realActivePlayers().length}`;
                    arena.innerHTML = '';
                    realActivePlayers().forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'player-btn';
                        card.style.setProperty('--zone-color', `var(${p.var})`);
                        card.innerHTML = `
                            <div class="zone-name" style="color:var(${p.var})">${safe(p.name)}</div>
                            <div class="manual-guess-container" id="guess-container-p${p.id}" style="display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0;">
                                <input type="text" id="guess-input-p${p.id}" placeholder="seconds" readonly inputmode="none"
                                    style="width:100px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Orbitron',sans-serif;font-size:0.9rem;text-align:center;"
                                    onfocus="numpadShow(this)">
                                <button class="btn btn-outline" id="guess-lock-p${p.id}" onclick="lockManualGuess(${p.id})"
                                    style="padding:8px 14px;font-size:0.8rem;font-weight:700;">LOCK</button>
                            </div>
                            <div class="zone-stat" id="stat-p${p.id}" style="font-size:0.8rem;color:var(--text-dim)">Enter your guess</div>`;
                        arena.appendChild(card);
                    });
                    // Show numpad targeting the first player's input
                    const firstP = realActivePlayers()[0];
                    if (firstP) numpadShow(el(`guess-input-p${firstP.id}`));
                    // Auto-lock timeout: prevent infinite hang if a player never locks
                    modeData.guessTimeout = addTimeout(() => {
                        realActivePlayers().forEach(p => {
                            if (!modeData.guesses[p.id]) {
                                const inp = el(`guess-input-p${p.id}`);
                                if (inp && !inp.value) inp.value = '0';
                                lockManualGuess(p.id);
                            }
                        });
                    }, 60000);
                    updateKbHint();
                    return false;
                }
            });
            return;
        }

        if (currentMode === 6) {
            display.textContent = '??.???';
            display.classList.add('hidden-timer');
            const [minS, maxS] = sanitizeRange('m6-min', 'm6-max', { min: 3, max: 8 });
            modeData.target = rand(minS * 1000, maxS * 1000);
            modeData.stopped = false;
            showToast('Clock is running... invisibly!');
            snd('go');
            // Subtle audio-only heartbeat cue (no visual circle)
            modeData.heartbeatAc = null;
            try {
                const ac = getAudioCtx();
                modeData.heartbeatAc = ac;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain); gain.connect(ac.destination);
                osc.type = 'sine'; osc.frequency.value = 1.5;
                gain.gain.value = 0.04;
                const lfo = ac.createOscillator();
                const lfoGain = ac.createGain();
                lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
                lfo.frequency.value = 0.3 + Math.random() * 0.5;
                lfoGain.gain.value = 0.8;
                lfo.start(); osc.start();
                modeData.heartbeatOsc = osc;
                modeData.heartbeatLfo = lfo;
            } catch(e) {}
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                if (elapsed >= modeData.target && !modeData.stopped) {
                    modeData.stopped = true;
                    modeData.actual = elapsed;
                    clearTimers();
                    snd('bad');
                    if (modeData.heartbeatOsc) { try { modeData.heartbeatOsc.stop(); } catch(e){} }
                    if (modeData.heartbeatLfo) { try { modeData.heartbeatLfo.stop(); } catch(e){} }
                    // Tap-to-lock: show a running counter, players tap to lock their guess
                    gs = STATE.RUNNING;
                    modeData.guesses = {};
                    modeData.lockedCount = 0;
                    modeData.guessStart = performance.now();
                    display.className = 'stopwatch-display running';
                    showToast('TAP when the counter matches!', 'var(--success)');
                    renderArena(ids);
                    updateKbHint();
                    // Auto-end timeout: prevent infinite hang
                    addTimeout(() => {
                        if (modeData.lockedCount < realActivePlayers().length) {
                            addTimeout(endRound, 100);
                        }
                    }, 60000);
                    liveDisplay(() => {
                        if (modeData.lockedCount >= realActivePlayers().length) return false;
                        const guessElapsed = performance.now() - modeData.guessStart;
                        display.textContent = fmt(guessElapsed);
                    });
                    return false;
                }
            });
            return;
        }

        if (currentMode === 2) {
            // Dynamic round duration: randomize ±30% around configured target
            const baseTarget = (parseFloat(el('m2-tgt').value) || 5) * 1000;
            const variance = baseTarget * 0.3;
            modeData.target = baseTarget + (Math.random() * 2 - 1) * variance;
            modeData.target = Math.max(1000, modeData.target);
            modeData.hits = {};
            modeData.done = 0;
            display.textContent = '??.???';
            display.classList.add('hidden-timer');
            el('arena-container').classList.add('pulse-glow');
            showToast(`Target: ${fmt(modeData.target)}s`);
            renderArena(ids);
            updateKbHint();
            if (el('s-distract')?.checked) {
                modeData.distractInterval = addInterval(() => {
                    if (gs !== STATE.RUNNING) return;
                    if (Math.random() < 0.4) {
                        el('arena-container').classList.add('distraction-flash');
                        setTimeout(() => el('arena-container').classList.remove('distraction-flash'), 150);
                    }
                    if (Math.random() < 0.25) shakeUI();
                }, 1500 + Math.random() * 2000);
            }
            addTimeout(endRound, modeData.target + 4500);
            return;
        }

        if (currentMode === 3) {
            // Dynamic round duration: randomize ±25% around configured interval
            const baseInterval = (parseFloat(el('m3-int').value) || 2) * 1000;
            const intervalVariance = baseInterval * 0.25;
            modeData.interval = baseInterval + (Math.random() * 2 - 1) * intervalVariance;
            modeData.interval = Math.max(500, modeData.interval);
            modeData.laps = clamp(parseInt(el('m3-laps').value, 10) || 2, 1, 10);
            modeData.variant = el('m3-variant')?.value || 'individual';
            modeData.roundMax = realActivePlayers().length * modeData.laps;
            modeData.turnIndex = 0;
            modeData.scores = Object.fromEntries(ids.map(id => [id, 0]));
            modeData.turns = [];
            modeData.masterElapsed = 0;
            modeData.cumulativeTarget = 0;
            renderArena(ids, p => `Tap or ${KEYS[p.id - 1].toUpperCase()}`, () => '0 pts');
            relaySetTurn();
            updateKbHint();
            return;
        }

        if (currentMode === 4) {
            if (playerCount < 2) {
                gs = STATE.MENU;
                display.className = 'stopwatch-display danger';
                display.textContent = 'NOPE';
                showToast('Bomb mode needs at least 2 players.', 'var(--danger)');
                shakeUI(); snd('bad');
                addTimeout(resetUI, 900);
                return;
            }
            // Determine active preset
            const activeBtn = el('config-area')?.querySelector('.preset-btn.active');
            const presetKey = activeBtn?.dataset?.preset || 'easy';
            const preset = MODE_PRESETS[4][presetKey];

            // Dynamic fuse calculation scaled by player count
            const fuseBase = playerCount * preset.baseBuffer * 1000;
            const fuseVar = rand(playerCount * preset.varMin * 1000, playerCount * preset.varMax * 1000);
            modeData.fuse = fuseBase + fuseVar;

            modeData.alive = ids.slice();
            modeData.holderIdx = Math.floor(Math.random() * modeData.alive.length);
            modeData.passCounts = Object.fromEntries(ids.map(id => [id, 0]));
            modeData.locked = null;
            // Min hold per turn: 1.5s base, randomized each turn in bombSetTurn
            modeData.minHold = 1500;
            modeData.baseMinHold = 1500;
            modeData.riskBonus = el('m4-risk')?.checked !== false;
            modeData.holdStart = performance.now();
            modeData.riskTime = Object.fromEntries(ids.map(id => [id, 0]));
            modeData.holdUnlocked = false;
            modeData.lastPasser = null;
            modeData.lastReceiver = null;

            // Generate Surge events (fake warnings) — random time windows during the fuse
            const surges = [];
            const surgeDuration = 1200; // ms per surge event
            for (let i = 0; i < preset.surgeCount; i++) {
                // Place surges in the middle 70% of the fuse (10%-80% range), avoiding overlap
                const earliest = modeData.fuse * 0.10;
                const latest = modeData.fuse * 0.80 - surgeDuration;
                let surgeStart;
                let attempts = 0;
                do {
                    surgeStart = rand(earliest, latest);
                    attempts++;
                } while (attempts < 50 && surges.some(s => Math.abs(s.start - surgeStart) < surgeDuration * 2));
                surges.push({ start: surgeStart, duration: surgeDuration, peak: preset.surgeIntensity });
            }
            modeData.surges = surges;
            modeData.surgeIntensity = preset.surgeIntensity;

            display.className = 'stopwatch-display danger';
            display.textContent = 'BOMB';
            renderArena(ids, p => `Pass to ${KEYS[p.id - 1].toUpperCase()}`, () => 'PASS');
            showToast(`Hold the bomb before you can pass!`, 'var(--danger)');
            bombSetTurn(true);
            updateKbHint();
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                const now = performance.now();
                const holdElapsed = now - modeData.holdStart;
                const holdDuration = holdElapsed;
                const holdRemaining = Math.max(0, modeData.minHold - holdElapsed);

                if (now < (modeData.passFlashUntil || 0)) {
                    display.textContent = '\u{1F525} PASS!';
                } else if (holdRemaining > 0) {
                    display.textContent = `HOLD ${(holdRemaining / 1000).toFixed(1)}s`;
                } else {
                    display.textContent = '\u{1F4A3} PASS!';
                }

                if (holdRemaining <= 0 && !modeData.holdUnlocked) {
                    modeData.holdUnlocked = true;
                    bombUnlockPass();
                }

                const gc = el('arena-container');
                const extraHold = Math.max(0, holdDuration - modeData.minHold);

                // Spontaneous explosion chance: scales from 0% to 30% per second over 4s of extra hold
                if (modeData.holdUnlocked && extraHold > 0) {
                    const maxExtraMs = 4000;
                    const explosionChanceMax = 0.30;
                    const progress = Math.min(extraHold / maxExtraMs, 1.0);
                    const explosionRate = explosionChanceMax * progress;
                    const frameProbability = explosionRate * (16.67 / 1000);
                    if (Math.random() < frameProbability) {
                        gc.style.background = '';
                        bombExplode();
                        return false;
                    }
                }

                // Option 3: Sensory Overload — punish greedy holding past minHold
                if (extraHold > 0 && modeData.holdUnlocked) {
                    // Full red + continuous max haptics to blind the player
                    gc.style.background = `rgba(255, 10, 10, 0.98)`;
                    if (Math.random() < 0.3) {
                        hap([30]);
                    }
                } else {
                    // Surge System: fake warnings to deceive players
                    let surgeLevel = 0;
                    for (const surge of modeData.surges) {
                        const surgeElapsed = elapsed - surge.start;
                        if (surgeElapsed >= 0 && surgeElapsed <= surge.duration) {
                            // Ramp up first half, ramp down second half
                            const half = surge.duration / 2;
                            const progress = surgeElapsed <= half
                                ? surgeElapsed / half
                                : 1 - (surgeElapsed - half) / half;
                            surgeLevel = Math.max(surgeLevel, progress * surge.peak);
                        }
                    }

                    // True baseline: gentle ramp based on fuse progress
                    const pct = elapsed / modeData.fuse;
                    const trueIntensity = pct * 0.3; // subtle linear ramp

                    // Combined intensity: max of true baseline and surge
                    const intensity = Math.max(trueIntensity, surgeLevel);

                    if (intensity > 0.02) {
                        const r = Math.round(180 + 75 * intensity);
                        const gb = Math.round(30 * (1 - intensity));
                        gc.style.background = `rgba(${r}, ${gb}, ${gb}, ${0.05 + intensity * 0.2})`;
                        // Haptic triggers scale with intensity
                        if (Math.random() < 0.04 * intensity) {
                            hap([Math.round(15 + 40 * intensity)]);
                        }
                    } else {
                        gc.style.background = '';
                    }
                }

                if (elapsed >= modeData.fuse) {
                    gc.style.background = '';
                    bombExplode();
                    return false;
                }
            });
            return;
        }

        if (currentMode === 5) {
            // Dynamic round duration: randomize ±25% around configured target
            const baseTarget = (parseFloat(el('m5-tgt').value) || 10) * 1000;
            const variance = baseTarget * 0.25;
            modeData.target = baseTarget + (Math.random() * 2 - 1) * variance;
            modeData.target = Math.max(2000, modeData.target);
            modeData.hits = {};
            modeData.done = 0;
            display.textContent = '??.???';
            display.classList.add('hidden-timer');
            showToast(`Target: ${fmt(modeData.target)}s — do not go over`);
            renderArena(ids);
            updateKbHint();
            addTimeout(endRound, modeData.target + 4500);
            return;
        }

        if (currentMode === 7) {
            const [minS, maxS] = sanitizeRange('m7-min', 'm7-max', { min: 5, max: 15 });
            modeData.target = rand(minS * 1000, maxS * 1000);
            const hideInput = parseInt(el('m7-hide')?.value ?? 50, 10);
            const hidePercent = clamp(Number.isNaN(hideInput) ? 50 : hideInput, 10, 90) / 100;
            modeData.hideAt = modeData.target * hidePercent;
            modeData.hidden = false;
            modeData.hits = {};
            modeData.done = 0;
            renderArena(ids);
            updateKbHint();
            showToast(`Countdown: ${fmt(modeData.target)}s • Hides at ${Math.round(hidePercent * 100)}%`);
            display.className = 'stopwatch-display running';
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, modeData.target - elapsed);
                if (elapsed >= modeData.hideAt) {
                    if (!modeData.hidden) {
                        modeData.hidden = true;
                        snd('tick');
                        showToast('HIDDEN NOW', 'var(--danger)');
                    }
                    display.textContent = '--.---';
                    display.classList.add('hidden-timer');
                } else {
                    display.classList.remove('hidden-timer');
                    display.textContent = fmt(remaining);
                }
            });
            addTimeout(endRound, modeData.target + 4000);
            return;
        }

        if (currentMode === 8) {
            const cdTime = (parseFloat(el('m8-cd')?.value) || 3) * 1000;
            const [minS, maxS] = sanitizeRange('m8-min', 'm8-max', { min: 1, max: 3 });
            modeData.cdTime = cdTime;
            modeData.hits = {};
            modeData.done = 0;
            modeData.signalFired = false;
            modeData.misfires = {};
            modeData.freezePoint = rand(0.3, 0.7);
            modeData.hiddenDelay = rand(minS * 1000, maxS * 1000);
            const freezeAt = cdTime * (1 - modeData.freezePoint);
            modeData.freezeAtMs = freezeAt;
            modeData.frozen = false;
            display.className = 'stopwatch-display running';
            showToast('Watch the countdown... wait for the signal!');
            renderArena(ids, p => `${KEYS[p.id - 1].toUpperCase()} — WAIT`, () => '...');
            updateKbHint();
            liveDisplay(() => {
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, cdTime - elapsed);
                if (!modeData.frozen && elapsed >= freezeAt) {
                    modeData.frozen = true;
                    modeData.frozenValue = remaining;
                    display.textContent = fmt(remaining);
                    showToast('FROZEN... wait for it...');
                    addTimeout(() => {
                        if (gs !== STATE.RUNNING) return;
                        modeData.signalFired = true;
                        modeData.signalTime = performance.now();
                        display.className = 'stopwatch-display';
                        display.style.color = 'var(--success)';
                        display.textContent = 'DRAW!';
                        showToast('DRAW! TAP NOW!', 'var(--success)');
                        snd('go'); hap([50, 30, 80]);
                        addTimeout(endRound, 3000);
                    }, modeData.hiddenDelay);
                    return false;
                }
                if (!modeData.frozen) {
                    display.textContent = fmt(remaining);
                }
            });
            return;
        }
    }

    function lockGuess(pId, e) {
        if (gs !== STATE.GUESSING) return;
        const input = el(`guess-p${pId}`);
        const val = parseFloat(input.value);
        if (Number.isNaN(val) || val <= 0) { numpadShow(input); return; }
        modeData.guesses[pId] = val * 1000;
        modeData.lockedCount += 1;
        input.disabled = true;
        input.value = '••••';
        const lockBtn = el(`lock-p${pId}`);
        lockBtn.disabled = true;
        lockBtn.textContent = '✓';
        hap([20]); snd('tap');
        if (modeData.lockedCount >= realActivePlayers().length) {
            numpadHide();
            addTimeout(endRound, 300);
        } else {
            // Move numpad focus to next unlocked input
            const actives = realActivePlayers();
            const nextP = actives.find(p => !modeData.guesses[p.id]);

            else numpadHide();

    function guessNext() {

        if (Number.isNaN(val) || val <= 0) return;
        const p = realActivePlayers()[modeData.pIndex];

    function precisionHit(pId) {

        const timingColor = timing === 'EARLY' ? 'var(--warn)' : (timing === 'LATE' ? 'var(--danger)' : 'var(--success)');
        el(`stat-p${pId}`).textContent = timing;
        el(`stat-p${pId}`).style.color = timingColor;

        modeData.done += 1;
        if (modeData.done >= realActivePlayers().length) addTimeout(endRound, 300);
    }

    function predictTapHit(pId) {

        if (!modeData.guessStart) return;

        modeData.guesses[pId] = guessElapsed;

        const btn = el(`btn-p${pId}`);

    function zenithHit(pId) {

        const btn = el(`btn-p${pId}`);
        btn.disabled = true; btn.classList.add('done');
        modeData.done += 1;

        // Early/Late feedback (Cliff: going over = BUST)

            el(`stat-p${pId}`).style.color = 'var(--danger)';

            const timing = diff < -(modeData.target * 0.1) ? 'EARLY' : 'CLOSE!';
            const timingColor = timing === 'EARLY' ? 'var(--warn)' : 'var(--success)';
            el(`stat-p${pId}`).textContent = timing;
            el(`stat-p${pId}`).style.color = timingColor;
        }

        if (modeData.done >= realActivePlayers().length) {
            const hasBust = realActivePlayers().some(p => modeData.hits[p.id] > modeData.target);
            if (hasBust) {

                display.textContent = 'TOO LATE — BUST';
                snd('bad'); shakeUI(); hap([60, 30, 60]);
            }
            addTimeout(endRound, hasBust ? 1200 : 300);
        }

            const actives = realActivePlayers();

    function blindHit(pId) { precisionHit(pId); }
    function relayTargetForTurn(turnIndex) {
        if (modeData.variant === 'sabotage') {
            return modeData.interval;

        return modeData.interval;
